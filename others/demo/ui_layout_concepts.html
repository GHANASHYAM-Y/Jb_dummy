  function social() {
    const cur = S.tabs.chat, show = cur || 'Arjun', f = friendByName(show);
    return `<div class="b-cols one" style="height:100%">${storiesRow()}<div class="b-chat ${cur ? 'has-thread' : ''}">
      <div class="list">${DATA.chats.map((c) => `<button class="b-crow ${c.name === show ? 'sel' : ''}" data-act="b-chat" data-f="${c.name}">${avd(friendByName(c.name), 46)}<div style="min-width:0"><b>${c.name}</b><small>${esc(c.last)} · ${c.time}</small></div>${c.unread ? `<span class="u">${c.unread}</span>` : ''}</button>`).join('')}</div>
      <div class="b-thread"><div class="b-thead"><button class="b-btn light b-tback" data-act="b-chatback" aria-label="Back" style="min-height:36px;padding:0 10px">${ic('back', 16)}</button>${avd(f, 40)}<div><b>${f.name}</b><small>${statusText(f)}</small></div><button class="b-btn acc" data-act="challenge" data-f="${f.name}">${ic('swords', 16)} Play</button></div>
        <div class="b-msgs">${show === 'Arjun' ? `<div class="b-msg sys">💃 You owe Arjun a Dance dare · 18h <button class="b-btn" style="min-height:32px;padding:0 12px" data-go="record">Record</button></div>` : ''}${DATA.thread.map((m) => `<div class="b-msg ${m.me ? 'me' : ''}">${esc(m.t)}</div>`).join('')}</div>
        <div class="b-compose2"><input class="js-msg" placeholder="Message ${f.name}…" aria-label="Message ${f.name}"><button class="b-btn acc" data-act="send" aria-label="Send">${ic('send', 16)}</button></div></div>
    </div></div>`;
  }

  function profile() {
    const t = S.tabs.bprof || 'history', me = DATA.me;
    const hist = `<div class="b-list">${DATA.history.map((h) => `<div class="b-frow"><span class="b-res ${h.res}">${h.res}</span>${av(friendByName(h.opp), 40)}<div><b>${h.game} vs ${h.opp}</b><small>${h.note} · ${h.ago}</small></div><div class="r" style="font:600 18px Fredoka">${h.score}</div></div>`).join('')}</div>`;
    const set = `<div class="b-list">${[['user', 'Edit name, bio & avatar', 'edit-profile', 'Edit'], ['globe', 'Language: English', 'lang', 'தமிழ்'], ['lock', 'Profile is public', 'toggle-vis', 'Public'], ['shield', '2 blocked players', 'blocked', 'Manage'], ['logout', 'Sign out', 'logout', 'Sign out'], ['x', 'Delete account', 'delete-acc', 'Delete…']].map(([i, l, a, b]) => `<div class="b-frow">${ic(i)}<div><b>${l}</b></div><div class="r"><button class="b-btn light" data-act="${a}">${b}</button></div></div>`).join('')}</div>`;
    return `<div class="b-cols one"><div><div class="b-cover"></div><div class="b-phead">${av(me, 104)}<div><h1>${me.name}</h1><small>${me.id} · joined ${me.joined}</small></div></div><p style="margin:0 0 4px 20px">${esc(me.bio)}</p>
      <div class="b-bubbles"><div><b>${me.wins}</b><small>wins</small></div><div><b>${winPct()}%</b><small>win rate</small></div><div><b>${me.daresDone}</b><small>dares done</small></div><div><b>${me.daresGiven}</b><small>dares given</small></div></div>
      <div class="b-badges" style="margin-bottom:18px"><span class="b-badge" style="--r:-3deg">🔥 4 streak</span><span class="b-badge" style="--r:2deg">✊ RPS 64%</span><span class="b-badge" style="--r:-1deg">🏏 Century</span><span class="b-badge" style="--r:3deg">🎤 Brave singer</span></div>
      <div class="b-tabs">${[['history', 'Matches'], ['settings', 'Settings']].map(([k, l]) => `<button class="${t === k ? 'sel' : ''}" data-act="tab" data-group="bprof" data-tab="${k}">${l}</button>`).join('')}</div>
      <div class="b-card">${t === 'history' ? hist : set}</div></div></div>`;
  }

  const mwrap = (inner) => `<div class="b-matchwrap"><div class="b-mbar"><button class="b-btn light" data-act="leave-match">${ic('x', 16)} Leave</button><span class="ttl">${esc(gameById(S.game).emoji)} ${esc(gameById(S.game).name)}</span><span style="width:90px"></span></div>${inner}</div>`;

  B.render = (r, p) => {
    switch (r) {
      case 'home': return shell(home());
      case 'game': return shell(lobby(p || 'rps'));
      case 'queue': return shell(queue(p || 'rps'), true);
      case 'match': return shell(mwrap(matchView()), true);
      case 'result': return shell(`<div class="b-flow">${resultView()}</div>`);
      case 'dare': return shell(dare());
      case 'record': return shell(`<div class="b-flow"><button class="b-back" data-go="dares">${ic('back', 16)} Dares</button>${recordView()}</div>`);
      case 'review': return shell(`<div class="b-flow"><button class="b-back" data-go="dares">${ic('back', 16)} Dares</button>${reviewView()}</div>`);
      case 'friends': return shell(friends());
      case 'dares': return shell(dares());
      case 'social': return shell(social());
      case 'profile': return shell(profile());
      default: return shell(home());
    }
  };

  function swipe(dir) {
    const top = $('.b-dcard.top'); if (!top) return;
    const cat = top.dataset.cat;
    top.style.transition = 'transform .35s ease, opacity .35s';
    top.style.transform = `translateX(${dir === 'yes' ? 420 : -420}px) rotate(${dir === 'yes' ? 24 : -24}deg)`;
    top.style.opacity = '0';
    setTimeout(() => {
      if (dir === 'yes') { S.pick.cat = cat; S.pick.item = null; toast(`${DATA.dareCats.find((c) => c.id === cat).name} it is. Now pick the exact dare.`, '♥'); }
      else S.tabs.bIdx = (S.tabs.bIdx || 0) + 1;
      refresh();
    }, 300);
  }

  B.mount = (root, r, p, isRefresh) => {
    if (r === 'queue' && !isRefresh) {
      const t0 = Date.now(); let ti = 0;
      const tips = ['Tip: rock is the most common opening throw.', 'You can keep browsing; we\'ll ping you when it\'s found.', 'Winner picks the dare. Loser gets 24 hours to record it.'];
      every(() => { const e = root.querySelector('.b-qt'); if (e) e.textContent = `0:${String(Math.floor((Date.now() - t0) / 1000)).padStart(2, '0')}`; }, 250);
      every(() => { const e = root.querySelector('.js-tip'); if (e) e.textContent = tips[++ti % tips.length]; }, 1600);
      later(() => { toast('Found someone!', '🎉'); startMatch(p || 'rps', 'quick', RANDOM_PLAYERS[1].name); }, 4200);
    }
    if (r === 'dare') {
      const top = root.querySelector('.b-dcard.top');
      if (top) {
        let x0 = null, dx = 0;
        top.addEventListener('pointerdown', (e) => { x0 = e.clientX; top.setPointerCapture(e.pointerId); top.style.transition = 'none'; });
        top.addEventListener('pointermove', (e) => { if (x0 == null) return; dx = e.clientX - x0; top.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`; top.querySelector('.yes').style.opacity = Math.max(0, dx / 100); top.querySelector('.no').style.opacity = Math.max(0, -dx / 100); });
        const end = () => { if (x0 == null) return; x0 = null; if (dx > 100) swipe('yes'); else if (dx < -100) swipe('no'); else { top.style.transition = ''; top.style.transform = ''; top.querySelectorAll('.st').forEach((s) => (s.style.opacity = 0)); } dx = 0; };
        top.addEventListener('pointerup', end); top.addEventListener('pointercancel', end);
      }
    }
    if (r === 'friends') { const inp = root.querySelector('.js-bsearch'); inp && inp.addEventListener('input', () => { const q = inp.value.toLowerCase(); root.querySelectorAll('.b-frow[data-name]').forEach((c) => (c.hidden = !c.dataset.name.includes(q))); }); }
    if (r === 'social') { const m = root.querySelector('.b-msgs'); if (m) m.scrollTop = m.scrollHeight; if (isRefresh) { const i = root.querySelector('.js-msg'); i && i.focus(); } }
  };

  B.acts = {
    'b-swipe': (el) => swipe(el.dataset.d),
    'b-restack': () => { S.pick.cat = null; S.pick.item = null; S.tabs.bIdx = 0; refresh(); },
    'b-set': (el) => { const v = el.dataset.v; S.tabs[el.dataset.k] = isNaN(+v) ? v : +v; refresh(); },
    'b-msg': (el) => { S.tabs.chat = el.dataset.f; go('social'); },
    'b-chat': (el) => { S.tabs.chat = el.dataset.f; refresh(); },
    'b-chatback': () => { S.tabs.chat = null; refresh(); },
  };
  CONCEPTS.b = B;
})();
</script>

<script id="js-c">
/* =====================================================================
   CONCEPT C — MATCHDAY
   ===================================================================== */
(() => {
  const C = {
    info: {
      short: 'Matchday', name: 'C · Matchday', tag: 'A sports newspaper for your friend group. Loud, flat, no gradients.',
      layout: 'Editorial grid with hard black borders and offset shadows. Home is a front page: a headline about you, "tonight\'s fixtures" as tear-off tickets, a head-to-head standings table, a dare desk and a polaroid wall of stories.',
      nav: 'Desktop: black sidebar of giant words (PLAY, FRIENDS, DARES, CHAT, ME). Mobile: a MENU button drops a full-screen menu of giant words. A live results ticker runs along the top everywhere.',
      interactions: ['Game tickets tear off when clicked, then open the fixture', 'Buttons physically press down (offset shadow collapses)', 'Sortable head-to-head standings table (click the column headers)', 'Split-screen VS matchmaking with a scrambling opponent name', 'Page changes wipe across in steps, like a scoreboard', 'Rock / Paper / Scissors as giant R P S letters'],
      fonts: 'Anton (headlines) + Space Grotesk (UI) + IBM Plex Mono (stats)',
      palette: ['#F2EEE3', '#0B0B0B', '#D4FF2E', '#FF3B1F', '#FFFFFF'],

  const TC = { rps: '#D4FF2E', chess: '#FFFFFF', cricket: '#FFB800', mystery: '#E4DDCC' };
  const navHtml = (act) => NAV.map(([k, l], i) => `<button class="c-nav ${act === k ? 'on' : ''}" data-go="${k}" ${act === k ? 'aria-current="page"' : ''}><span>0${i + 1}</span>${l}${k === 'dares' ? `<i>${dareNeedsYou()}</i>` : ''}</button>`).join('');
  const ticker = () => {
    const items = ['<b>LIVE</b> VIKRAM 3–2 ZARA_99 · RPS', 'PRIYA vs DIVYA · CHESS · MOVE 18', '<b>FT</b> KAVIN WINS HAND CRICKET BY 12 RUNS', 'RAHUL OWES MONESH 🎤 SINGING · 9H LEFT', '<b>NEW</b> HAND CRICKET IS LIVE · 73 PLAYING', 'ARJUN BEAT MONESH 1–0 · CHECKMATE MOVE 31'];
    const s = items.join(' &nbsp;&nbsp;/&nbsp;&nbsp; ');
    return `<div class="c-ticker" aria-label="Live results"><span class="lab">LIVE</span><span class="run">${s} &nbsp;&nbsp;/&nbsp;&nbsp; ${s} &nbsp;&nbsp;/&nbsp;&nbsp;</span></div>`;
  };

  function shell(content, full) {
    if (full) return `<div class="c-shell sv" style="grid-template-columns:1fr;grid-template-rows:1fr"><main class="scroll" style="position:relative"><div class="page" style="position:absolute;inset:0">${content}</div></main></div>`;
    const act = ACTIVE[App.route] || 'home';
    return `<div class="c-shell sv">
      <aside class="c-side"><div class="c-logo">EVO<br>AIQU<small>THE DAILY · ED. ${DATA.me.matches}</small></div>${navHtml(act)}
        <button class="me" data-go="profile">${av(DATA.me, 36)}<span><b>${DATA.me.name}</b>${DATA.me.id}</span></button></aside>
      <div class="c-mhead"><div class="c-logo">EVOAIQU</div><button data-act="c-menu">MENU ☰</button></div>
      ${ticker()}
      <main class="c-main scroll"><div class="page">${content}</div></main>
      ${S.tabs.cmenu ? `<div class="c-menu"><button class="x" data-act="c-menu">CLOSE ✕</button>${navHtml(act)}</div>` : ''}
    </div>`;
  }

  const desk = () => `<div class="c-desk">${DATA.dares.map((d) => `<button data-go="${d.kind === 'review' ? 'review' : d.kind === 'owe' ? 'record' : 'dares'}"><span class="e">${d.emoji}</span><span><b>${d.kind === 'owe' ? `You owe ${d.who}: ${d.cat}` : d.kind === 'review' ? `Review ${d.who}'s ${d.cat}` : `${d.who} owes you: ${d.cat}`}</b><small>${esc(d.game)} · ${d.kind === 'review' ? 'watch once' : d.hours + 'h left'}</small></span><span class="due">${d.kind === 'owe' ? 'RECORD' : d.kind === 'review' ? 'REVIEW' : d.hours + 'H'}</span></button>`).join('')}</div>`;

  function standings() {
    const k = S.tabs.csort || 'pct';
    const rows = DATA.friends.map((f) => ({ f, w: f.h2h[0], l: f.h2h[1], pct: Math.round((f.h2h[0] / Math.max(1, f.h2h[0] + f.h2h[1])) * 100) }));
    rows.sort((a, b) => (k === 'name' ? a.f.name.localeCompare(b.f.name) : b[k] - a[k]));
    const th = (key, l, cls = '') => `<th class="${cls}"><button class="${k === key ? 'on' : ''}" data-act="c-sort" data-k="${key}">${l}${k === key ? ' ▼' : ''}</button></th>`;
    return `<table class="c-table"><thead><tr>${th('name', 'Friend')}${th('w', 'W')}${th('l', 'L')}${th('pct', 'Win%')}<th class="hide-m">Status</th></tr></thead><tbody>${rows.map((r) => `<tr><td><button class="c-nm" data-act="challenge" data-f="${r.f.name}">${av(r.f, 26)}${r.f.name}</button></td><td class="n">${r.w}</td><td class="n">${r.l}</td><td class="n">${r.pct}%</td><td class="hide-m"><span class="c-st ${r.f.status}">${r.f.status === 'match' ? 'IN MATCH' : r.f.status}</span></td></tr>`).join('')}</tbody></table>`;
  }

  function home() {
    const d = new Date();
    const date = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    return `<div class="c-mast"><span>The EVOAIQU Daily</span><span>${date}</span><span>Edition ${DATA.me.matches}</span></div>
      <section class="c-lead"><div><h1>${DATA.me.name} on a <mark>${DATA.me.streak}-win</mark> streak.</h1><p>Beat Rahul by 17 runs and Priya 5–3 tonight. Still owes Arjun a dance after a checkmate on move 31. <b>Two dares need attention.</b></p>
        <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="c-btn acc" data-go="queue" data-param="rps">${ic('bolt', 16)} Quick match</button><button class="c-btn" data-go="dares">Open the dare desk</button></div></div>
        <div class="c-bignum"><div><b>${DATA.me.wins}</b><small>Wins</small></div><div><b>${DATA.me.losses}</b><small>Losses</small></div><div><b>${winPct()}%</b><small>Win rate</small></div><div><b>${DATA.me.daresGiven}</b><small>Dares given</small></div></div></section>
      <div class="c-sec"><h2>Tonight's fixtures</h2><span>Click a ticket to enter</span></div>
      <div class="c-tix">${DATA.games.map((g, i) => `<button class="c-tik ${g.soon ? 'soon' : ''}" style="--tc:${TC[g.id]}" ${g.soon ? 'data-act="notify"' : `data-act="c-ticket" data-g="${g.id}"`}>${g.soon ? '<span class="c-stamp">COMING SOON</span>' : ''}<span class="c-stub"><span class="e">${g.emoji}</span><span class="v">ADMIT ONE · No.0${i + 1}</span></span><span class="c-tbody"><span class="no">FIXTURE 0${i + 1}${g.isNew ? ' · NEW' : ''}</span><b>${esc(g.name)}</b><p>${esc(g.tagline)}</p><span class="tm">${g.soon ? '<span class="c-tag">In development</span>' : `<span class="c-tag live">${g.live} live</span>`}${g.meta.map((m) => `<span class="c-tag">${esc(m)}</span>`).join('')}</span></span></button>`).join('')}</div>
      <div class="c-three">
        <div><div class="c-sec"><h2>Standings</h2><span>Head to head</span></div>${standings()}</div>
        <div><div class="c-sec"><h2>Dare desk</h2><button data-go="dares">All →</button></div>${desk()}</div>
        <div><div class="c-sec"><h2>Stories</h2><button data-go="social">All →</button></div><div class="c-pols"><button class="c-pol post" style="--r:-2deg" data-go="record"><span class="img">+ POST</span><b>Your dare</b><small>record & share</small></button>${DATA.stories.slice(0, 3).map((s, i) => `<button class="c-pol" style="--c:${s.color};--r:${[2, -1.5, 1.5][i]}deg" data-act="story" data-i="${i}"><span class="img">${s.emoji}</span><b>${s.name}</b><small>${esc(s.cat)} · ${s.ago} ago</small></button>`).join('')}</div></div>
      </div>`;
  }

  function lobby(id) {
    const g = gameById(id), i = DATA.games.indexOf(g);
    const tc = S.tabs.chessTime ?? 1, col = S.tabs.chessCol ?? 'Random';
    const inv = { rps: ['Arjun', 'Wants a rematch. Expires 1:40.'], chess: ['Priya', 'Blitz 5+3. Your move.'], cricket: ['Rahul', 'Challenged you. Expires 4:12.'] }[id];
    return `<button class="c-back" data-go="home">${ic('back', 14)} Front page</button>
      <div class="c-gh"><div class="no">Fixture 0${i + 1} · ${g.online} online · ${g.live} live now</div><h1>${esc(g.name)}</h1></div>
      <div class="c-gcols">
        <div>${g.rules.length ? `<div class="c-rules">${g.rules.map((r, k) => `<div><b>${k + 1}</b>${esc(r)}</div>`).join('')}</div>` : '<p>In development. Random party mini-games where the loser records a dare on the spot.</p>'}
          ${id === 'chess' ? `<div class="c-sec"><h2>Clock</h2></div><div class="c-radio">${DATA.chessTimes.map((t, k) => `<button class="${tc === k ? 'sel' : ''}" data-act="c-set" data-k="chessTime" data-v="${k}">${t[0]} ${t[1]}</button>`).join('')}</div><div class="c-sec"><h2>Colour</h2></div><div class="c-radio">${['Random', 'White', 'Black'].map((c) => `<button class="${col === c ? 'sel' : ''}" data-act="c-set" data-k="chessCol" data-v="${c}">${c}</button>`).join('')}</div>` : ''}
        </div>
        <div class="c-entry">
          ${g.soon ? '<button class="c-bar" data-act="notify">Notify me →<small>WHEN IT LAUNCHES</small></button>' : `
          ${g.modes.includes('quick') ? `<button class="c-bar blk" data-go="queue" data-param="${id}"><span>Quick match<small>RANDOM OPPONENT · FAIR PAIRING</small></span>→</button>` : ''}
          ${g.modes.includes('friend') ? `<button class="c-bar" data-act="c-pickf" data-g="${id}"><span>Challenge a friend<small>WINNER PICKS THE DARE</small></span>→</button>` : ''}
          ${g.modes.includes('solo') ? `<button class="c-bar" data-act="start" data-g="${id}" data-mode="solo"><span>Solo vs EVO Bot<small>PRACTICE · NOTHING SAVED</small></span>→</button>` : ''}
          ${inv ? `<div class="c-sec" style="margin-top:14px"><h2>Classifieds</h2></div><div class="c-classi">${av(friendByName(inv[0]), 36)}<div><b>${inv[0]}</b><small>${inv[1]}</small></div><button class="c-btn acc" data-act="start" data-g="${id}" data-mode="friend" data-f="${inv[0]}">${id === 'chess' ? 'Open' : 'Accept'}</button></div>` : ''}`}
        </div>

  }

  function queue(id) {
    const g = gameById(id);
    return `<div class="c-split"><div class="c-half l">${av(DATA.me, 110)}<h2>${DATA.me.name}</h2><small>${DATA.me.id} · ${winPct()}% win rate</small></div>
      <div class="c-half r">${av({ name: '?', color: '#333' }, 110)}<h2 class="js-scr">SEARCHING</h2><small class="js-qt">${esc(g.name)} · 0:00</small></div>
      <div class="c-vsdot">VS</div>
      <div class="c-qbar"><button class="c-btn" data-act="bg-queue" data-g="${id}">Keep browsing</button><button class="c-btn blk" data-act="cancel-queue">Cancel</button></div></div>`;

  function friends() {
    return `<div class="c-gh"><div class="no">${DATA.friends.length} friends · ${DATA.friends.filter((f) => f.status !== 'offline').length} around · your ID ${DATA.me.id}</div><h1>Friends</h1></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin:18px 0"><label class="c-classi" style="flex:1;min-width:220px;padding:0 12px;box-shadow:none">${ic('search', 18)}<input class="js-csearch" style="flex:1;height:44px;border:0;outline:0;background:none;font:500 14px 'Space Grotesk';min-width:0" placeholder="Search name or EVO-ID" aria-label="Search friends"></label><button class="c-btn acc" data-act="copy">${ic('link', 16)} Copy invite link</button><button class="c-btn" data-act="share-wa">WhatsApp</button></div>
      ${DATA.requests.length ? `<div class="c-sec"><h2>Requests</h2><span>${DATA.requests.length} waiting</span></div><div style="display:grid;gap:10px">${DATA.requests.map((r) => `<div class="c-classi">${av(r, 36)}<div><b>${r.name}</b><small>${r.mutual} mutual friends</small></div><button class="c-btn acc" data-act="accept" data-f="${r.name}">Accept</button><button class="c-btn" data-act="decline" data-f="${r.name}">Decline</button></div>`).join('')}</div>` : ''}
      <div class="c-sec"><h2>The roster</h2><span>Click a header to sort</span></div>
      <table class="c-table"><thead><tr><th>Friend</th><th class="hide-m">EVO-ID</th><th>Status</th><th class="hide-m">H2H</th><th></th></tr></thead><tbody>${DATA.friends.map((f) => `<tr data-name="${esc((f.name + ' ' + f.id).toLowerCase())}"><td><span class="c-nm">${av(f, 28)}${f.name}</span></td><td class="n hide-m">${f.id}</td><td><span class="c-st ${f.status}">${f.status === 'match' ? 'IN ' + f.game : f.status === 'offline' ? f.last : 'online'}</span></td><td class="n hide-m">${f.h2h[0]}–${f.h2h[1]}</td><td style="text-align:right;white-space:nowrap"><button class="c-btn" style="min-height:34px" data-act="c-msg" data-f="${f.name}">Msg</button> <button class="c-btn acc" style="min-height:34px" data-act="challenge" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>Play</button></td></tr>`).join('')}</tbody></table>
      <div class="c-sec"><h2>You may know</h2></div><div style="display:flex;gap:12px;flex-wrap:wrap">${DATA.suggestions.map((s) => `<div class="c-classi" style="box-shadow:var(--sh)">${av(s, 36)}<div><b>${s.name}</b><small>${s.mutual} mutual</small></div><button class="c-btn" data-act="add" data-f="${s.name}">+ Add</button></div>`).join('')}</div>`;
  }

  function dares() {
    const row = (d) => `<tr><td style="font-size:24px">${d.emoji}</td><td><b>${d.kind === 'owe' ? `You owe ${d.who}` : d.kind === 'review' ? `${d.who} submitted` : `${d.who} owes you`}</b><br><small style="font:500 11px 'IBM Plex Mono'">${esc(d.cat)}: ${esc(d.text)}</small></td><td class="n hide-m">${esc(d.game)}</td><td class="n">${d.hours ? d.hours + 'H' : 'NOW'}</td><td style="text-align:right">${d.kind === 'owe' ? '<button class="c-btn acc" data-go="record">Record</button>' : d.kind === 'review' ? '<button class="c-btn acc" data-go="review">Watch once</button>' : `<button class="c-btn" data-act="nudge" data-f="${d.who}">Nudge</button>`}</td></tr>`;
    return `<div class="c-gh"><div class="no">The ledger · ${dareNeedsYou()} need you</div><h1>Dare desk</h1></div>
      <div class="c-sec"><h2>Open</h2></div><table class="c-table"><thead><tr><th></th><th>Dare</th><th class="hide-m">From</th><th>Due</th><th></th></tr></thead><tbody>${DATA.dares.map(row).join('')}</tbody></table>
      <div class="c-sec"><h2>Settled</h2></div><table class="c-table"><tbody><tr><td style="font-size:24px">🎤</td><td><b>You sang for Vikram</b></td><td class="n">APPROVED</td></tr><tr><td style="font-size:24px">🎭</td><td><b>Priya's mimicry for you</b></td><td class="n">APPROVED</td></tr></tbody></table>`;
  }

  function social() {
    const cur = S.tabs.chat, show = cur || 'Arjun', f = friendByName(show);
    return `<div class="c-gh"><div class="no">Stories vanish after 24 hours</div><h1>Chat &amp; stories</h1></div>
      <div class="c-pols" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));margin:20px 0 26px"><button class="c-pol post" style="--r:-1deg" data-go="record"><span class="img">+ POST</span><b>Your dare</b><small>record</small></button>${DATA.stories.map((s, i) => `<button class="c-pol" style="--c:${s.color};--r:${[1.5, -2, 1, -1, 2][i]}deg" data-act="story" data-i="${i}"><span class="img">${s.emoji}</span><b>${s.name}</b><small>${esc(s.cat)} · ${s.ago}</small></button>`).join('')}</div>
      <div class="c-chat ${cur ? 'has-thread' : ''}"><div class="c-clist">${DATA.chats.map((c) => `<button class="c-crow ${c.name === show ? 'sel' : ''}" data-act="c-chat" data-f="${c.name}">${av(friendByName(c.name), 38)}<div style="min-width:0"><b>${c.name}</b><small>${esc(c.last)}</small></div>${c.unread ? `<span class="u">${c.unread}</span>` : ''}</button>`).join('')}</div>
        <div class="c-thread"><div class="c-thead"><button class="c-btn c-tback" style="min-height:34px" data-act="c-chatback">←</button>${av(f, 34)}<b>${f.name}</b><button class="c-btn acc" data-act="challenge" data-f="${f.name}">Challenge</button></div>
          <div class="c-msgs">${show === 'Arjun' ? `<div class="c-msg sys">💃 YOU OWE ARJUN A DANCE · 18H<button class="c-btn" style="min-height:32px" data-go="record">Record</button></div>` : ''}${DATA.thread.map((m) => `<div class="c-msg ${m.me ? 'me' : ''}">${esc(m.t)}</div>`).join('')}</div>
          <div class="c-compose"><input class="js-msg" placeholder="Message ${f.name}…" aria-label="Message ${f.name}"><button data-act="send">Send</button></div></div></div>`;
  }

  function profile() {
    const me = DATA.me, t = S.tabs.cprof || 'history';
    return `<div class="c-gh"><div class="no">${me.id} · joined ${me.joined} · Gold II</div><h1>${me.name}</h1><p style="margin-top:8px;font-size:16px">${esc(me.bio)}</p></div>
      <div class="c-alm" style="margin-top:22px"><div><b>${me.matches}</b><small>Played</small></div><div><b>${me.wins}</b><small>Won</small></div><div><b>${winPct()}%</b><small>Win rate</small></div><div><b>${me.streak}</b><small>Streak</small></div><div><b>64%</b><small>RPS</small></div><div><b>48%</b><small>Chess</small></div><div><b>67%</b><small>Cricket</small></div><div><b>${me.daresDone}/${me.daresGiven}</b><small>Dares done/given</small></div></div>
      <div class="c-sec"><h2>${t === 'history' ? 'Results' : 'Settings'}</h2><span><button class="c-btn" style="min-height:32px" data-act="tab" data-group="cprof" data-tab="${t === 'history' ? 'settings' : 'history'}">${t === 'history' ? 'Settings →' : '← Results'}</button></span></div>
      ${t === 'history' ? `<table class="c-table"><tbody>${DATA.history.map((h) => `<tr><td><span class="c-wl ${h.res}">${h.res}</span></td><td><b>${h.game} vs ${h.opp}</b><br><small style="font:500 11px 'IBM Plex Mono';text-transform:uppercase">${h.note}</small></td><td class="n">${h.score}</td><td class="n hide-m">${h.ago}</td></tr>`).join('')}</tbody></table>`
      : `<table class="c-table"><tbody>${[['Name, bio & avatar', 'edit-profile', 'Edit'], ['Language · English', 'lang', 'தமிழ்'], ['Profile visibility', 'toggle-vis', 'Public'], ['Blocked players · 2', 'blocked', 'Manage'], ['Sign out', 'logout', 'Sign out'], ['Delete account', 'delete-acc', 'Delete']].map(([l, a, b]) => `<tr><td><b>${l}</b></td><td style="text-align:right"><button class="c-btn" style="min-height:34px" data-act="${a}">${b}</button></td></tr>`).join('')}</tbody></table>`}`;
  }

  const mwrap = (inner) => `<div class="c-mwrap"><div class="c-mtop"><button data-act="leave-match">✕ Leave</button><span><b>● LIVE</b> · ${esc(gameById(S.game).name)} · vs ${esc(S.opp.name)}</span><span></span></div>${inner}</div>`;

  C.render = (r, p) => {
    switch (r) {
      case 'home': return shell(home());
      case 'game': return shell(lobby(p || 'rps'));
      case 'queue': return shell(queue(p || 'rps'), true);
      case 'match': return shell(mwrap(matchView()), true);
      case 'result': return shell(`<div class="c-flow">${resultView()}</div>`);
      case 'dare': return shell(`<div class="c-flow"><button class="c-back" data-go="result">${ic('back', 14)} Result</button>${dareView()}</div>`);
      case 'record': return shell(`<div class="c-flow"><button class="c-back" data-go="dares">${ic('back', 14)} Dare desk</button>${recordView()}</div>`);
      case 'review': return shell(`<div class="c-flow"><button class="c-back" data-go="dares">${ic('back', 14)} Dare desk</button>${reviewView()}</div>`);
      case 'friends': return shell(friends());
      case 'dares': return shell(dares());
      case 'social': return shell(social());
      case 'profile': return shell(profile());
      default: return shell(home());
    }
  };

  C.mount = (root, r, p, isRefresh) => {
    if (!isRefresh) S.tabs.cmenu = false;
    if (r === 'queue' && !isRefresh) {
      const t0 = Date.now(), names = ['ZARA_99', 'ISHAAN', 'LEO.K', 'MEERA', 'NIKHIL', 'ANANYA', 'KARTHIK'];
      let locked = false;
      every(() => { if (locked) return; const e = root.querySelector('.js-scr'); if (e) e.textContent = pick(names); const q = root.querySelector('.js-qt'); if (q) q.textContent = `${gameById(p || 'rps').name} · 0:${String(Math.floor((Date.now() - t0) / 1000)).padStart(2, '0')}`; }, 90);
      later(() => { locked = true; const e = root.querySelector('.js-scr'); if (e) e.textContent = 'LEO.K'; const q = root.querySelector('.js-qt'); if (q) q.textContent = 'OPPONENT LOCKED IN'; later(() => startMatch(p || 'rps', 'quick', 'Leo.K'), 1300); }, 3400);
    }
    if (r === 'friends') { const inp = root.querySelector('.js-csearch'); inp && inp.addEventListener('input', () => { const q = inp.value.toLowerCase(); root.querySelectorAll('tr[data-name]').forEach((c) => (c.hidden = !c.dataset.name.includes(q))); }); }
    if (r === 'social') { const m = root.querySelector('.c-msgs'); if (m) m.scrollTop = m.scrollHeight; if (isRefresh) { const i = root.querySelector('.js-msg'); i && i.focus(); } }
  };

  C.acts = {
    'c-ticket': (el) => { el.classList.add('tear'); setTimeout(() => go('game', el.dataset.g), 450); },
    'c-sort': (el) => { S.tabs.csort = el.dataset.k; refresh(); },
    'c-menu': () => { S.tabs.cmenu = !S.tabs.cmenu; refresh(); },
    'c-set': (el) => { const v = el.dataset.v; S.tabs[el.dataset.k] = isNaN(+v) ? v : +v; refresh(); },
    'c-msg': (el) => { S.tabs.chat = el.dataset.f; go('social'); },
    'c-chat': (el) => { S.tabs.chat = el.dataset.f; refresh(); },
    'c-chatback': () => { S.tabs.chat = null; refresh(); },
    'c-pickf': (el) => {
      const g = gameById(el.dataset.g);
      openSheet(`Who's playing ${g.short}?`, `<div class="sheet-list">${DATA.friends.map((f) => `<button class="sheet-item" data-act="start" data-g="${g.id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>${av(f, 40)}<span class="si-txt"><b>${f.name}</b><small>${statusText(f)} · ${f.h2h[0]}–${f.h2h[1]}</small></span><span class="si-go">→</span></button>`).join('')}</div>`);
    },
  };
  CONCEPTS.c = C;
})();
</script>

<script id="js-d">
/* =====================================================================
   CONCEPT D — BENTO HUD
   ===================================================================== */
(() => {
  const D = {
    palette: true, vt: true,
    info: {
      short: 'Bento', name: 'D · Bento HUD', tag: 'Everything at a glance on one screen, like a control room.',
      layout: 'Home is a single bento grid of tiles: Play, live players, dares due (countdown rings), win rate, friends online, stories, recent matches. No scrolling past five sections to find things. Pages are master-detail panes (friends, chat) and a kanban board for dares.',
      nav: 'Slim icon rail on the left that expands to show labels; breadcrumb top bar with Ctrl+K search. Mobile: floating bottom bar.',
      interactions: ['"Customize" makes tiles wiggle; drag them to rearrange your home', 'Tiles morph into full pages with smooth View Transitions', 'Rail expands/collapses; tooltips when collapsed', 'Live countdown rings on every dare', 'Master-detail friends: pick someone to see head-to-head stats and challenge', 'Dares as a kanban board: Needs you → Waiting → Done', 'Ctrl+K command palette'],
      fonts: 'Sora (display) + Inter (UI) + JetBrains Mono (data)',
      palette: ['#0C0D10', '#15171C', '#262A32', '#C6F432', '#FF6B5B', '#ECEEF2'],
      best: 'Power users and returning players. Most information per screen, cleanest to build with your current component setup.',
    },
  };
  const NAV = [['home', 'grid', 'Home'], ['friends', 'users', 'Friends'], ['dares', 'target', 'Dares'], ['social', 'chat', 'Chat & Stories'], ['profile', 'user', 'Profile']];
  const ACTIVE = { home: 'home', game: 'home', queue: 'home', result: 'home', dare: 'home', friends: 'friends', dares: 'dares', record: 'dares', review: 'dares', social: 'social', profile: 'profile' };
  const CRUMB = { home: 'Home', game: 'Play', queue: 'Matchmaking', result: 'Result', dare: 'Pick a dare', friends: 'Friends', dares: 'Dares', record: 'Record dare', review: 'Review', social: 'Chat & Stories', profile: 'Profile' };
  const ring = (p, s = 38, c = '#C6F432') => { const r = s / 2 - 4, L = 2 * Math.PI * r; return `<svg width="${s}" height="${s}"><circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="#262A32" stroke-width="4"/><circle cx="${s / 2}" cy="${s / 2}" r="${r}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - p)}"/></svg>`; };
  const spark = () => { const pts = [12, 18, 15, 22, 30, 26, 34, 31, 40, 37, 45, 52]; const w = 300, h = 46, mx = 55; const d = pts.map((v, i) => `${(i / (pts.length - 1)) * w},${h - (v / mx) * h}`).join(' '); return `<svg class="d-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${d} ${w},${h} 0,${h}" fill="rgba(198,244,50,.1)" stroke="none"/><polyline points="${d}" fill="none" stroke="#C6F432" stroke-width="2"/></svg>`; };
  const ORDER0 = ['play', 'live', 'dares', 'rate', 'friends', 'stories', 'recent', 'cricket'];

  function shell(content, full) {
    if (full) return `<div class="d-shell sv" style="grid-template-columns:1fr"><main class="scroll" style="position:relative"><div class="page" style="position:absolute;inset:0">${content}</div></main></div>`;
    const act = ACTIVE[App.route] || 'home';
    const wide = S.tabs.dwide;
    return `<div class="d-shell sv ${wide ? 'wide' : ''}">
      <nav class="d-rail" aria-label="Main"><div class="d-brand"><i>EQ</i><span class="lbl" style="opacity:${wide ? 1 : 0}">EVOAIQU</span></div>
        ${NAV.map(([k, i, l]) => `<button class="d-ri ${act === k ? 'on' : ''}" data-go="${k}" aria-label="${l}" ${act === k ? 'aria-current="page"' : ''}>${ic(i, 20)}<span class="lbl">${l}</span>${k === 'dares' ? `<span class="b">${dareNeedsYou()}</span>` : ''}<span class="tip">${l}</span></button>`).join('')}
        <span class="grow"></span>
        <button class="d-ri" data-act="d-wide" aria-label="${wide ? 'Collapse' : 'Expand'} menu">${ic(wide ? 'back' : 'chev', 20)}<span class="lbl">Collapse</span><span class="tip">Expand</span></button>
      </nav>
      <div class="d-body">
        <header class="d-top"><div class="d-crumb">EVOAIQU ${ic('chev', 14)} <b>${CRUMB[App.route] || 'Home'}${App.route === 'game' ? ' · ' + esc(gameById(App.param).name) : ''}</b></div><span class="d-sp"></span>
          <button class="d-search" data-act="palette" aria-label="Search">${ic('search', 16)}<span>Search games, friends…</span><kbd>Ctrl K</kbd></button>
          ${App.route === 'home' ? `<button class="d-tbtn ${S.tabs.dedit ? 'on' : ''}" data-act="d-edit">${ic('drag', 16)}<span class="lbl">${S.tabs.dedit ? 'Done' : 'Customize'}</span></button>` : ''}
          <button class="d-tbtn" data-go="profile" aria-label="Profile">${av(DATA.me, 24)}</button></header>
        <main class="d-main scroll"><div class="page">${content}</div></main>
        <nav class="d-mbar" aria-label="Main">${NAV.map(([k, i, l]) => `<button class="${act === k ? 'on' : ''}" data-go="${k}" aria-label="${l}">${ic(i, 22)}</button>`).join('')}</nav>
      </div></div>`;
  }

  const tileHead = (t, go, param, live) => `<div class="d-th"><h3>${live ? '<span class="live"></span>' : ''}${t}</h3><span style="display:flex;gap:4px"><span class="d-grip">${ic('drag', 18)}</span>${go ? `<button class="d-exp" data-go="${go}" ${param ? `data-param="${param}"` : ''} aria-label="Open ${t}">${ic('expand', 16)}</button>` : ''}</span></div>`;
  const TILES = {
    play: () => { const g = gameById(S.tabs.dg || 'rps'); return `<div class="d-tile w2 h2 d-play" data-tile="play"><span class="bigemoji">${g.emoji}</span>${tileHead('Play', 'game', g.id)}
      <div class="d-seg" role="tablist">${DATA.games.map((x) => `<button class="${x.id === g.id ? 'sel' : ''}" role="tab" aria-selected="${x.id === g.id}" data-act="d-game" data-g="${x.id}">${x.short}</button>`).join('')}</div>
      <h2>${esc(g.name)}</h2><p>${esc(g.tagline)}</p><div class="d-meta">${g.meta.map((m) => `<span>${esc(m)}</span>`).join('')}${g.soon ? '' : `<span style="color:var(--acc)">● ${g.online} online</span>`}</div>
      <div class="acts">${g.soon ? '<button class="d-btn" data-act="notify">🔔 Notify me</button>' : `${g.modes.includes('quick') ? `<button class="d-btn acc" data-go="queue" data-param="${g.id}">${ic('bolt', 18)} Quick match</button>` : ''}${g.modes.includes('solo') ? `<button class="d-btn acc" data-act="start" data-g="${g.id}" data-mode="solo">${ic('bot', 18)} Solo vs bot</button>` : ''}${g.modes.includes('friend') ? `<button class="d-btn" data-act="d-pickf" data-g="${g.id}">${ic('swords', 18)} Challenge friend</button>` : ''}<button class="d-btn" data-go="game" data-param="${g.id}">Lobby</button>`}</div></div>`; },
    live: () => `<div class="d-tile" data-tile="live">${tileHead('Online now', null, null, true)}<div class="d-num">247<small>players</small></div>${spark()}</div>`,
    dares: () => `<div class="d-tile h2" data-tile="dares">${tileHead('Dares', 'dares')}<div class="d-list">${DATA.dares.map((d) => `<button class="d-li" data-go="${d.kind === 'review' ? 'review' : d.kind === 'owe' ? 'record' : 'dares'}"><span class="d-ring">${ring(d.hours ? d.hours / 24 : 1, 38, d.kind === 'owe' ? '#FF6B5B' : '#C6F432')}<span>${d.emoji}</span></span><div><b>${d.kind === 'owe' ? `You owe ${d.who}` : d.kind === 'review' ? `Review ${d.who}` : `${d.who} owes you`}</b><small>${esc(d.cat)} · ${d.hours ? d.hours + 'h left' : 'ready now'}</small></div></button>`).join('')}</div><button class="d-btn sm" style="margin-top:auto" data-go="dares">Open board</button></div>`,
    rate: () => { const p = winPct() / 100, r = 34, L = 2 * Math.PI * r; return `<div class="d-tile" data-tile="rate">${tileHead('Win rate', 'profile')}<div class="d-donut"><svg width="84" height="84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="#262A32" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="#C6F432" stroke-width="9" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L * (1 - p)}"/></svg><div><b>${winPct()}%</b><small>${DATA.me.wins}W · ${DATA.me.losses}L<br>${DATA.me.streak} streak 🔥</small></div></div></div>`; },
    friends: () => { const on = DATA.friends.filter((f) => f.status !== 'offline'); return `<div class="d-tile" data-tile="friends">${tileHead('Friends online', 'friends')}<div class="d-stack">${on.map((f) => av(f, 34)).join('')}</div><small style="color:var(--mu)">${on.length} online · ${DATA.requests.length} requests</small><button class="d-btn sm" style="margin-top:auto" data-act="challenge" data-f="${on[0].name}">Challenge ${on[0].name}</button></div>`; },
    stories: () => `<div class="d-tile w2" data-tile="stories">${tileHead('Stories · 24h', 'social')}<div class="d-strip hide-sb"><button class="d-sc post" data-go="record">${ic('plus', 18)}Post</button>${DATA.stories.map((s, i) => `<button class="d-sc" style="--c:${s.color}" data-act="story" data-i="${i}"><span class="e">${s.emoji}</span>${s.name}</button>`).join('')}</div></div>`,
    recent: () => `<div class="d-tile w2" data-tile="recent">${tileHead('Recent matches', 'profile')}<div class="d-list">${DATA.history.slice(0, 3).map((h) => `<div class="d-li"><span class="d-res ${h.res}">${h.res}</span><div><b>${h.game} vs ${h.opp}</b><small>${h.note}</small></div><span class="r">${h.score}</span></div>`).join('')}</div></div>`,
    cricket: () => `<div class="d-tile d-promo" data-tile="cricket"><span class="tag">NEW</span><b>Hand Cricket</b><small style="color:var(--mu)">Throw 1–6. 2 overs a side.</small><span class="e">🏏</span><button class="d-btn sm" style="margin-top:auto;align-self:flex-start" data-go="game" data-param="cricket">Try it</button></div>`,
  };

  function home() {
    const order = S.tabs.dorder || ORDER0;
    return `<div class="d-grid ${S.tabs.dedit ? 'edit' : ''}">${order.map((k) => TILES[k]()).join('')}</div>${S.tabs.dedit ? '<p class="d-sub" style="margin-top:14px">Drag tiles to rearrange your home. Click Done when finished.</p>' : ''}`;
  }

  function lobby(id) {
    const g = gameById(id);
    const tc = S.tabs.chessTime ?? 1, col = S.tabs.chessCol ?? 'Random';
    const inv = { rps: ['Arjun', 'wants a rematch · 1:40'], chess: ['Priya', 'Blitz · your move'], cricket: ['Rahul', 'challenged you · 4:12'] }[id];
    return `<button class="d-back" data-go="home">${ic('back', 16)} Home</button><div class="d-detail">
      <div class="d-tile d-hero d-play"><span class="bigemoji" style="font-size:200px">${g.emoji}</span><div class="d-th"><h3>${g.soon ? 'Coming soon' : '<span class="live"></span>' + g.online + ' online · ' + g.live + ' live'}</h3></div><h1>${esc(g.name)}</h1><p>${esc(g.tagline)}</p><div class="d-meta">${g.meta.map((m) => `<span>${esc(m)}</span>`).join('')}</div>
        <div class="acts">${g.soon ? '<button class="d-btn" data-act="notify">🔔 Notify me</button>' : `${g.modes.includes('quick') ? `<button class="d-btn acc" data-go="queue" data-param="${id}">${ic('bolt', 18)} Quick match</button>` : ''}${g.modes.includes('solo') ? `<button class="d-btn acc" data-act="start" data-g="${id}" data-mode="solo">${ic('bot', 18)} Solo vs EVO Bot</button>` : ''}${g.modes.includes('friend') ? `<button class="d-btn" data-act="d-pickf" data-g="${id}">${ic('swords', 18)} Challenge a friend</button>` : ''}`}</div></div>
      ${inv ? `<div class="d-tile">${tileHead('Invites')}<div class="d-li">${av(friendByName(inv[0]), 36)}<div><b>${inv[0]}</b><small>${inv[1]}</small></div></div><button class="d-btn acc sm" style="margin-top:auto" data-act="start" data-g="${id}" data-mode="friend" data-f="${inv[0]}">${id === 'chess' ? 'Open game' : 'Accept'}</button></div>` : ''}
      <div class="d-tile">${tileHead('Your record')}<div class="d-num">${{ rps: '64%', chess: '48%', cricket: '67%', mystery: '–' }[id]}<small>won</small></div><small style="color:var(--mu);margin-top:auto">${{ rps: '23W 13L', chess: '11W 12L', cricket: '8W 4L', mystery: 'No games yet' }[id]}</small></div>
      ${g.rules.length ? `<div class="d-tile" style="grid-column:span 2">${tileHead('Rules')}<ol class="d-steps">${g.rules.map((r) => `<li>${esc(r)}</li>`).join('')}</ol></div>` : ''}
      ${id === 'chess' ? `<div class="d-tile">${tileHead('Settings')}<div class="d-seg">${DATA.chessTimes.map((t, i) => `<button class="${tc === i ? 'sel' : ''}" data-act="d-set" data-k="chessTime" data-v="${i}">${t[1]}</button>`).join('')}</div><div class="d-seg" style="margin-top:8px">${['Random', 'White', 'Black'].map((c) => `<button class="${col === c ? 'sel' : ''}" data-act="d-set" data-k="chessCol" data-v="${c}">${c}</button>`).join('')}</div></div>` : ''}
    </div>`;
  }

  function queue(id) {
    const g = gameById(id), r = 100, L = 2 * Math.PI * r;
    return `<div class="d-main"><button class="d-back" data-act="cancel-queue">${ic('back', 16)} ${esc(g.name)}</button><div class="d-queue">
      <div class="d-qring"><svg width="220" height="220"><circle cx="110" cy="110" r="${r}" fill="none" stroke="#262A32" stroke-width="8"/><g class="arc"><circle cx="110" cy="110" r="${r}" fill="none" stroke="#C6F432" stroke-width="8" stroke-linecap="round" stroke-dasharray="${L * 0.22} ${L}"/></g></svg><div class="c"><b class="js-qt">0:00</b><small>est. wait 0:05</small></div></div>
      <h2 class="d-h1">Matching you…</h2><p class="d-sub">${esc(g.name)} · similar win rate · fair pairing. Expires after 2 minutes.</p>
      <div class="d-qstats"><div><b>128</b><small>in RPS now</small></div><div><b>34</b><small>live matches</small></div><div><b>~5s</b><small>avg wait</small></div></div>
      <div style="display:flex;gap:10px;justify-content:center"><button class="d-btn" data-act="bg-queue" data-g="${id}">${ic('grid', 16)} Keep browsing</button><button class="d-btn" data-act="cancel-queue">Cancel</button></div></div></div>`;
  }

  function friends() {
    const sel = S.tabs.dfriend, f = friendByName(sel || 'Arjun');
    const li = (x) => `<button class="d-li ${x.name === f.name ? 'sel' : ''}" data-act="d-friend" data-f="${x.name}" data-name="${esc((x.name + ' ' + x.id).toLowerCase())}"><span style="position:relative;display:inline-flex">${av(x, 36)}<span style="position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--s1);background:${x.status === 'online' ? '#C6F432' : x.status === 'match' ? '#FFC53D' : '#4a5060'}"></span></span><div><b>${x.name}</b><small>${statusText(x)}</small></div><span class="r">${x.h2h[0]}–${x.h2h[1]}</span></button>`;
    return `<div class="d-md ${sel ? 'has-sel' : ''}">
      <div class="d-pane list"><label class="d-inp">${ic('search', 16)}<input class="js-dsearch" placeholder="Search name or EVO-ID" aria-label="Search friends"></label>
        <div style="display:flex;gap:6px;margin-bottom:6px"><button class="d-btn sm acc" data-act="copy">${ic('link', 14)} Invite link</button><button class="d-btn sm" data-act="share-wa">WhatsApp</button></div>
        ${DATA.requests.length ? `<div class="d-lbl">Requests · ${DATA.requests.length}</div>${DATA.requests.map((r) => `<div class="d-li">${av(r, 36)}<div><b>${r.name}</b><small>${r.mutual} mutual</small></div><button class="d-btn sm acc" data-act="accept" data-f="${r.name}" aria-label="Accept ${r.name}">${ic('check', 14)}</button><button class="d-btn sm" data-act="decline" data-f="${r.name}" aria-label="Decline ${r.name}">${ic('x', 14)}</button></div>`).join('')}` : ''}
        <div class="d-lbl">Friends · ${DATA.friends.length}</div><div class="d-list scroll">${DATA.friends.map(li).join('')}</div>
        <div class="d-lbl">Suggested</div>${DATA.suggestions.map((s) => `<div class="d-li">${av(s, 36)}<div><b>${s.name}</b><small>${s.mutual} mutual</small></div><button class="d-btn sm" data-act="add" data-f="${s.name}">Add</button></div>`).join('')}
      </div>
      <div class="d-pane detail"><div class="d-fd"><button class="d-back d-tback" data-act="d-friendback">${ic('back', 16)} Friends</button>
        <div class="head">${av(f, 76)}<div><h2>${f.name}</h2><small>${f.id} · ${statusText(f)}</small></div></div>
        <div class="d-kpis"><div><b>${f.h2h[0]}–${f.h2h[1]}</b><small>Head to head</small></div><div><b>${f.fav}</b><small>Favourite game</small></div><div><b>${f.h2h[0] > f.h2h[1] ? 'You' : f.h2h[0] < f.h2h[1] ? f.name : 'Even'}</b><small>Leads</small></div></div>
        <div class="d-lbl" style="padding-left:0">Challenge</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:16px">${DATA.games.filter((g) => !g.soon).map((g) => `<button class="d-btn" data-act="start" data-g="${g.id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>${g.emoji} ${g.short}</button>`).join('')}</div>
        <div style="display:flex;gap:8px"><button class="d-btn" data-act="d-msg" data-f="${f.name}">${ic('chat', 16)} Message</button><button class="d-btn" data-act="block" data-f="${f.name}">Block</button><button class="d-btn" data-act="toast-remove" data-f="${f.name}">Remove</button></div>
      </div></div></div>`;
  }

  function dares() {
    const kc = (d) => `<div class="d-kc"><div class="top"><span class="d-ring">${ring(d.hours ? d.hours / 24 : 1, 38, d.kind === 'owe' ? '#FF6B5B' : '#C6F432')}<span>${d.emoji}</span></span><div><b>${d.kind === 'owe' ? `You owe ${d.who}` : d.kind === 'review' ? `${d.who} submitted` : `${d.who} owes you`}</b><small>${esc(d.game)} · ${d.hours ? d.hours + 'h left' : 'ready'}</small></div></div><p>${esc(d.cat)}: ${esc(d.text)}</p>${d.kind === 'owe' ? `<button class="d-btn acc sm" data-go="record">${ic('video', 14)} Record</button>` : d.kind === 'review' ? `<button class="d-btn acc sm" data-go="review">${ic('play', 12)} Watch once</button>` : `<button class="d-btn sm" data-act="nudge" data-f="${d.who}">Nudge</button>`}</div>`;
    const need = DATA.dares.filter((d) => d.kind !== 'waiting'), wait = DATA.dares.filter((d) => d.kind === 'waiting');
    return `<h1 class="d-h1">Dares</h1><p class="d-sub">One board for every dare: yours, theirs, and finished ones.</p>
      <div class="d-kanban"><div class="d-col"><h3>Needs you <span>${need.length}</span></h3>${need.map(kc).join('')}</div><div class="d-col"><h3>Waiting on friends <span>${wait.length}</span></h3>${wait.map(kc).join('')}</div>
        <div class="d-col"><h3>Done <span>2</span></h3><div class="d-kc done"><div class="top"><span style="font-size:24px">🎤</span><div><b>You sang for Vikram</b><small>Approved · on stories</small></div></div></div><div class="d-kc done"><div class="top"><span style="font-size:24px">🎭</span><div><b>Priya's mimicry</b><small>Approved</small></div></div></div></div></div>`;
  }

  function social() {
    const cur = S.tabs.chat, show = cur || 'Arjun', f = friendByName(show);
    return `<div class="d-chat3 ${cur ? 'has-thread' : ''}">
      <div class="d-pane list"><label class="d-inp">${ic('search', 16)}<input placeholder="Search chats" aria-label="Search chats"></label>${DATA.chats.map((c) => `<button class="d-li ${c.name === show ? 'sel' : ''}" data-act="d-chat" data-f="${c.name}">${av(friendByName(c.name), 38)}<div><b>${c.name}</b><small>${esc(c.last)}</small></div><span class="r">${c.unread ? `<span style="background:var(--acc);color:var(--acc-tx);padding:1px 6px;border-radius:6px">${c.unread}</span>` : c.time}</span></button>`).join('')}</div>
      <div class="d-pane thread"><div class="d-thead"><button class="d-btn sm d-tback" data-act="d-chatback" aria-label="Back">${ic('back', 14)}</button>${av(f, 36)}<div><b>${f.name}</b><small>${statusText(f)}</small></div><button class="d-btn sm acc" data-act="challenge" data-f="${f.name}">${ic('swords', 14)} Challenge</button></div>
        ${show === 'Arjun' ? `<div class="d-banner">💃 You owe Arjun a Dance dare · 18h left<button class="d-btn sm acc" data-go="record">Record</button></div>` : ''}
        <div class="d-msgs">${DATA.thread.map((m) => `<div class="d-msg ${m.me ? 'me' : ''}">${esc(m.t)}</div>`).join('')}</div>
        <div class="d-compose"><input class="js-msg" placeholder="Message ${f.name}…" aria-label="Message ${f.name}"><button class="d-btn acc" data-act="send" aria-label="Send">${ic('send', 16)}</button></div></div>
      <div class="d-pane side"><div class="d-th"><h3>Stories · 24h</h3></div><div class="d-vstories"><button class="d-sc post" data-go="record">${ic('plus', 18)}Post your dare</button>${DATA.stories.map((s, i) => `<button class="d-sc" style="--c:${s.color}" data-act="story" data-i="${i}"><span class="e">${s.emoji}</span>${s.name} · ${s.ago}</button>`).join('')}</div></div>
    </div>`;
  }

  function profile() {
    const me = DATA.me;
    return `<div class="d-pgrid">
      <div class="d-tile w2 h2"><div style="display:flex;gap:16px;align-items:center">${av(me, 80)}<div><h1 class="d-h1">${me.name}</h1><button style="font:500 12px 'JetBrains Mono';color:var(--mu)" data-act="copy-id">${me.id} ${ic('copy', 12)}</button></div></div><p style="color:#c9ced8;margin:14px 0">${esc(me.bio)}</p><div class="d-meta"><span>Gold II</span><span>Lv 14</span><span>Joined ${me.joined}</span><span>Public</span></div><div style="margin-top:auto;display:flex;gap:8px"><button class="d-btn" data-act="edit-profile">Edit profile</button><button class="d-btn" data-act="lang">தமிழ்</button></div></div>
      ${TILES.rate()}
      <div class="d-tile">${tileHead('Played')}<div class="d-num">${me.matches}</div><small style="color:var(--mu);margin-top:auto">${me.daresDone} dares done · ${me.daresGiven} given</small></div>
      <div class="d-tile w2">${tileHead('By game')}${[['RPS', 64, '#FF6B2C'], ['Chess', 48, '#2BD67B'], ['Cricket', 67, '#FFC53D']].map(([n, p, c]) => `<div style="display:grid;grid-template-columns:70px 1fr 40px;gap:10px;align-items:center;font-size:13px;margin-bottom:8px"><span>${n}</span><span style="height:8px;border-radius:4px;background:var(--s2);overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:${c}"></i></span><span style="font-family:'JetBrains Mono';color:var(--mu)">${p}%</span></div>`).join('')}</div>
      <div class="d-tile w2 h2">${tileHead('Match history')}<div class="d-list">${DATA.history.map((h) => `<div class="d-li"><span class="d-res ${h.res}">${h.res}</span>${av(friendByName(h.opp), 30)}<div><b>${h.game} vs ${h.opp}</b><small>${h.note} · ${h.ago}</small></div><span class="r">${h.score}</span></div>`).join('')}</div></div>
      <div class="d-tile w2 h2">${tileHead('Settings')}<div class="d-set">${[['globe', 'Language · English', 'lang', 'தமிழ்'], ['lock', 'Visibility', 'toggle-vis', 'Public'], ['shield', 'Blocked · 2', 'blocked', 'Manage'], ['logout', 'Sign out', 'logout', 'Sign out'], ['x', 'Delete account', 'delete-acc', 'Delete']].map(([i, l, a, b]) => `<div class="d-setr">${ic(i, 18)}${l}<button class="d-btn sm" data-act="${a}">${b}</button></div>`).join('')}</div></div>
    </div>`;
  }

  const mwrap = (inner) => `<div class="d-mwrap"><div class="d-mtop"><button class="d-btn sm" data-act="leave-match">${ic('x', 14)} Leave</button><span class="t">${esc(gameById(S.game).name)}<small>vs ${esc(S.opp.name)}</small></span><span class="sp"></span><span class="ping">● 18ms · synced</span></div>${inner}</div>`;
  const flow = (inner, back) => `${back ? `<button class="d-back" data-go="${back[0]}">${ic('back', 16)} ${back[1]}</button>` : ''}<div class="d-flow">${inner}</div>`;

  D.render = (r, p) => {
    switch (r) {
      case 'home': return shell(home());
      case 'game': return shell(lobby(p || 'rps'));
      case 'queue': return shell(queue(p || 'rps'), true);
      case 'match': return shell(mwrap(matchView()), true);
      case 'result': return shell(flow(resultView()));
      case 'dare': return shell(flow(dareView(), ['result', 'Result']));
      case 'record': return shell(flow(recordView(), ['dares', 'Dares']));
      case 'review': return shell(flow(reviewView(), ['dares', 'Dares']));
      case 'friends': return shell(friends());
      case 'dares': return shell(dares());
      case 'social': return shell(social());
      case 'profile': return shell(profile());
      default: return shell(home());
    }
  };

  D.mount = (root, r, p, isRefresh) => {
    if (r === 'home' && S.tabs.dedit) {
      let dragKey = null;
      root.querySelectorAll('[data-tile]').forEach((t) => {
        t.draggable = true;
        t.addEventListener('dragstart', (e) => { dragKey = t.dataset.tile; t.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragKey); } catch (x) { /* ignore */ } });
        t.addEventListener('dragend', () => t.classList.remove('drag'));
        t.addEventListener('dragover', (e) => { e.preventDefault(); t.classList.add('over'); });
        t.addEventListener('dragleave', () => t.classList.remove('over'));
        t.addEventListener('drop', (e) => {
          e.preventDefault(); t.classList.remove('over');
          const to = t.dataset.tile; if (!dragKey || dragKey === to) return;
          const o = [...(S.tabs.dorder || ORDER0)]; const a = o.indexOf(dragKey), b = o.indexOf(to);
          o.splice(a, 1); o.splice(b, 0, dragKey); S.tabs.dorder = o; refresh();
        });
      });
    }
    if (r === 'queue' && !isRefresh) {
      const t0 = Date.now();
      every(() => { const e = root.querySelector('.js-qt'); if (e) e.textContent = `0:${String(Math.floor((Date.now() - t0) / 1000)).padStart(2, '0')}`; }, 250);
      later(() => { toast('Matched with Ishaan · 61% win rate', '⚡'); startMatch(p || 'rps', 'quick', 'Ishaan'); }, 3800);
    }
    if (r === 'friends') { const inp = root.querySelector('.js-dsearch'); inp && inp.addEventListener('input', () => { const q = inp.value.toLowerCase(); root.querySelectorAll('.d-li[data-name]').forEach((c) => (c.hidden = !c.dataset.name.includes(q))); }); }
    if (r === 'social') { const m = root.querySelector('.d-msgs'); if (m) m.scrollTop = m.scrollHeight; if (isRefresh) { const i = root.querySelector('.js-msg'); i && i.focus(); } }
  };

  D.acts = {
    'd-wide': () => { S.tabs.dwide = !S.tabs.dwide; refresh(); },
    'd-edit': () => { S.tabs.dedit = !S.tabs.dedit; if (!S.tabs.dedit) toast('Layout saved', '✓'); refresh(); },
    'd-game': (el) => { S.tabs.dg = el.dataset.g; refresh(); },
    'd-set': (el) => { const v = el.dataset.v; S.tabs[el.dataset.k] = isNaN(+v) ? v : +v; refresh(); },
    'd-friend': (el) => { S.tabs.dfriend = el.dataset.f; refresh(); },
    'd-friendback': () => { S.tabs.dfriend = null; refresh(); },
    'd-msg': (el) => { S.tabs.chat = el.dataset.f; go('social'); },
    'd-chat': (el) => { S.tabs.chat = el.dataset.f; refresh(); },
    'd-chatback': () => { S.tabs.chat = null; refresh(); },
    'toast-remove': (el) => toast(`${el.dataset.f} removed (mock)`, '✕'),
    'd-pickf': (el) => {
      const g = gameById(el.dataset.g);
      openSheet(`Challenge · ${g.name}`, `<p class="sheet-sub">Pick a friend. They get 5 minutes to accept.</p><div class="sheet-list">${DATA.friends.map((f) => `<button class="sheet-item" data-act="start" data-g="${g.id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>${av(f, 38)}<span class="si-txt"><b>${f.name}</b><small>${statusText(f)} · ${f.h2h[0]}–${f.h2h[1]}</small></span><span class="si-go">→</span></button>`).join('')}</div>`);
    },
  };
  CONCEPTS.d = D;
})();
</script>

<!--CONCEPT_SCRIPTS-->

<script>
/* ---------- boot ---------- */
initToolbar();
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '#a/home'; else render();
setTimeout(() => { if (!sessionStorage.getItem('evo-info-seen')) { $('#info').classList.add('open'); $('#infoBtn').setAttribute('aria-expanded', 'true'); try { sessionStorage.setItem('evo-info-seen', '1'); } catch (e) {} } }, 300);
</script>
</body>
