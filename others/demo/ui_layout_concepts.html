<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVOAIQU Layout Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&family=IBM+Plex+Mono:wght@500;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Sora:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   PREVIEW SHELL (neutral chrome around the concepts — not part of a design)
   ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#18181b;color:#e4e4e7;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

.tb{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#0f0f11;border-bottom:1px solid #27272a;position:relative;z-index:200;overflow-x:auto;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb-brand{font-weight:700;white-space:nowrap;font-size:13px;color:#a1a1aa}
.tb-brand b{color:#fafafa}
.tb-seg{display:flex;background:#1c1c1f;border:1px solid #27272a;border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.tb-seg button{padding:6px 12px;border-radius:7px;font-size:13px;font-weight:600;color:#a1a1aa;white-space:nowrap}
.tb-seg button:hover{color:#fafafa}
.tb-seg button[aria-pressed="true"]{background:#fafafa;color:#09090b}
.tb-spacer{flex:1}
.tb-btn{padding:7px 12px;border-radius:9px;border:1px solid #27272a;background:#1c1c1f;font-size:13px;font-weight:600;white-space:nowrap;color:#d4d4d8;flex-shrink:0}
.tb-btn:hover{border-color:#52525b;color:#fafafa}
.tb-btn[aria-expanded="true"]{background:#fafafa;color:#09090b;border-color:#fafafa}
.tb-menu{position:fixed;top:60px;right:16px;width:300px;max-height:calc(100vh - 80px);overflow:auto;background:#0f0f11;border:1px solid #27272a;border-radius:14px;padding:8px;z-index:300;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.tb-menu.open{display:block}
.tb-menu h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#71717a;padding:8px 10px 4px}
.tb-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:#d4d4d8}
.tb-menu button:hover{background:#1c1c1f;color:#fff}
.info{position:fixed;top:60px;right:16px;width:360px;max-width:calc(100vw - 32px);max-height:calc(100vh - 80px);overflow:auto;background:#0f0f11;border:1px solid #27272a;border-radius:16px;padding:18px;z-index:300;display:none;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.info.open{display:block}
.info h3{font-size:17px;color:#fafafa;margin-bottom:2px}
.info .tag{color:#a1a1aa;font-size:13px;margin-bottom:12px}
.info dl{display:grid;gap:10px}
.info dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#71717a}
.info dd{font-size:13px;color:#d4d4d8}
.info ul{padding-left:16px;display:grid;gap:3px}
.info .sw{display:flex;gap:6px;flex-wrap:wrap}
.info .sw i{width:26px;height:26px;border-radius:7px;border:1px solid #3f3f46;display:block}
.info .x{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:8px;color:#a1a1aa}
.info .x:hover{background:#1c1c1f;color:#fff}

#stage{height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;position:relative;background:#18181b}
#frame{position:relative;width:100%;height:100%;overflow:hidden;container:frame/inline-size;background:#000;transition:width .35s ease,height .35s ease,border-radius .35s ease}
#stage.mobile #frame{width:390px;height:min(844px,calc(100% - 28px));border-radius:44px;border:10px solid #050506;box-shadow:0 0 0 1px #3f3f46,0 30px 80px rgba(0,0,0,.6)}
#app{position:absolute;inset:0;overflow:hidden}
#overlay{position:absolute;inset:0;z-index:50;pointer-events:none}
#overlay.on{pointer-events:auto}
#pill{position:absolute;z-index:45}
#toasts{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90%}

/* shared helpers available to every concept */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c,#888);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:calc(var(--s) * .42);flex-shrink:0;position:relative;line-height:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.hide-sb{scrollbar-width:none}.hide-sb::-webkit-scrollbar{display:none}
@keyframes burst{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.burst{position:absolute;pointer-events:none;font-size:26px;animation:burst 1s ease-out forwards;z-index:70}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<style id="css-shared-overlays">
/* ===== shared overlay bases (each concept overrides colours/shape) ===== */
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes grow{to{width:100%}}
@keyframes toast-in{from{opacity:0;transform:translateY(16px) scale(.96)}}
.ov-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#overlay.shown .ov-backdrop{opacity:1}
.sheet{position:absolute;max-height:85%;overflow:auto}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sheet-x{width:34px;height:34px;border-radius:10px;flex-shrink:0}
.sheet-list{display:grid;gap:8px}
.sheet-item{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}
.si-emoji{font-size:28px;line-height:1}
.si-txt b{display:block}.si-txt small{font-size:12px;opacity:.7}
.si-go{margin-left:auto;opacity:.6}
.sheet-item.is-soon{opacity:.45;cursor:not-allowed}
.sheet-sub,.sheet-foot{font-size:13px;opacity:.75;margin-bottom:12px}
.sheet-foot{margin:12px 0 0}
.sheet .r-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ov-story .ov-backdrop{background:rgba(0,0,0,.88)}
.story{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,100%);height:min(680px,100%);border-radius:24px;overflow:hidden;background:linear-gradient(170deg,var(--c),#0b0b0e 85%);color:#fff;display:flex;flex-direction:column;padding:14px;font-family:Inter,system-ui,sans-serif}
.story-bars{display:flex;gap:4px;position:relative;z-index:2}
.story-bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.story-bars i b{display:block;height:100%;width:0;background:#fff}
.story-bars i.done b{width:100%}
.story-bars i.run b{animation:grow 4s linear forwards}
.story-head{display:flex;align-items:center;gap:10px;margin-top:12px;position:relative;z-index:2}
.story-head b{display:block;font-size:14px}.story-head small{font-size:11px;opacity:.75}
.story-x{margin-left:auto;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.3);color:#fff}
.story-media{flex:1;display:grid;place-items:center;position:relative}
.story-emoji{font-size:120px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.4))}
.story-play{position:absolute;bottom:10px;left:0;font-size:12px;font-weight:700;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
.story-cap{font-size:15px;font-weight:600;margin:6px 0 10px;position:relative;z-index:2}
.story-actions{display:flex;gap:8px;position:relative;z-index:2}
.story-react{height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.story-react:hover{background:rgba(255,255,255,.28)}
.story-tap{position:absolute;top:70px;bottom:110px;width:42%;z-index:1}
.story-tap.prev{left:0}.story-tap.next{right:0}
.ov-palette .ov-backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.palette{position:absolute;left:50%;top:12%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:#141418;border:1px solid rgba(255,255,255,.12);border-radius:20px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);color:#F5F5F6;font-family:Inter,system-ui,sans-serif}
.pal-in{width:100%;height:58px;padding:0 20px;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);outline:0;font-size:17px;color:#fff}
.pal-list{max-height:340px;overflow:auto;padding:6px}
.pal-item{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 14px;border-radius:12px;text-align:left;font-size:14px;font-weight:600}
.pal-item small{font-size:11px;color:#8a8a96;text-transform:uppercase;letter-spacing:.06em}
.pal-item.sel,.pal-item:hover{background:var(--pal,#FF6B2C);color:#0B0B0E}
.pal-item.sel small,.pal-item:hover small{color:rgba(0,0,0,.6)}
.pal-empty{padding:16px;color:#8a8a96}
.pal-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#8a8a96}
.toast{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:14px;background:#141418;color:#fff;font:600 13px Inter,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:toast-in .3s cubic-bezier(.2,1.3,.4,1) both}
.toast.out{opacity:0;transform:translateY(8px);transition:.3s}
.qpill{display:flex;align-items:center;gap:10px;padding:7px 7px 7px 14px;border-radius:999px;font:600 13px Inter,system-ui,sans-serif;box-shadow:0 12px 30px rgba(0,0,0,.35);white-space:nowrap}
.qpill button{padding:7px 12px;border-radius:999px;font-weight:700}
.qp-dot{width:9px;height:9px;border-radius:50%;background:currentColor;animation:blink 1s infinite}
</style>

<style id="css-a">
/* =====================================================================
   CONCEPT A — ARCADE LAUNCHER
   ===================================================================== */
.app-a,.ov-a,.pill-a,.toast-a{--bg:#0B0B0E;--s1:rgba(255,255,255,.05);--s2:rgba(255,255,255,.1);--ln:rgba(255,255,255,.1);--tx:#F5F5F6;--mu:#9A9AA6;--win:#3BE07A;--bad:#FF6B6B}
.app-a{font-family:Inter,system-ui,sans-serif;color:var(--tx);background:var(--bg)}
.app-a .page-enter{animation:a-zoom .35s cubic-bezier(.2,1,.3,1) both}
@keyframes a-zoom{from{opacity:0;transform:scale(.97) translateY(8px)}}
.a-shell{position:absolute;inset:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.a-amb{position:absolute;inset:-10%;background:radial-gradient(45% 40% at 25% 18%,color-mix(in srgb,var(--g) 34%,transparent),transparent 70%),radial-gradient(40% 40% at 90% 85%,color-mix(in srgb,var(--g) 16%,transparent),transparent 70%);pointer-events:none;transition:background .5s}
.a-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 28px}
.a-me{display:flex;align-items:center;gap:12px;padding:5px 16px 5px 5px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);text-align:left}
.a-me:hover{background:var(--s2)}
.a-me b{display:block;font-size:14px;line-height:1.15}
.a-me small{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mu)}
.a-xp{width:70px;height:4px;border-radius:4px;background:var(--ln);overflow:hidden}.a-xp i{display:block;height:100%;width:68%;background:var(--g)}
.a-top-r{display:flex;align-items:center;gap:8px}
.a-ibtn{position:relative;height:40px;min-width:40px;padding:0 12px;border-radius:12px;background:var(--s1);border:1px solid var(--ln);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;color:var(--tx)}
.a-ibtn:hover{background:var(--s2)}
.a-ibtn kbd{font:600 11px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:6px;background:var(--s2);color:var(--mu)}
.a-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--g);color:#0B0B0E;font:800 11px Inter;display:grid;place-items:center;padding:0 4px;font-style:normal}
.a-clock{font:700 15px 'JetBrains Mono',monospace;color:var(--mu);padding-left:6px}
.a-main{position:relative;z-index:1;padding:0 28px 130px}
.a-main.full{grid-row:1/-1;padding:0}
.a-main.full .page{position:absolute;inset:0}
.a-dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:8px;border-radius:24px;background:rgba(22,22,27,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--ln);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.a-dock button{position:relative;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:var(--mu);transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .15s,color .15s}
.a-dock button:hover{transform:translateY(-7px) scale(1.14);color:var(--tx);background:var(--s2)}
.a-dock button.on{color:#0B0B0E;background:var(--g)}
.a-dock .tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(4px);background:#F5F5F6;color:#0B0B0E;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:.15s}
.a-dock button:hover .tip{opacity:1;transform:translateX(-50%)}
.a-dock .a-badge{top:3px;right:3px}
.a-dock button.on .a-badge{background:#0B0B0E;color:var(--g)}
/* home */
.a-hello{font-size:14px;color:var(--mu);margin:6px 0 4px}
.a-hello b{color:var(--tx)}
.a-shelf{display:flex;gap:18px;align-items:flex-end;padding:22px 6px 28px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 28px}
.a-tile{--t:#888;position:relative;flex:0 0 auto;width:170px;height:212px;border-radius:28px;background:linear-gradient(160deg,var(--t),color-mix(in srgb,var(--t) 45%,#000));display:flex;flex-direction:column;justify-content:flex-end;padding:16px;text-align:left;color:#0B0B0E;transition:transform .35s cubic-bezier(.2,1.4,.4,1),box-shadow .3s,width .35s cubic-bezier(.2,1.2,.4,1),height .35s cubic-bezier(.2,1.2,.4,1),opacity .3s,filter .3s;scroll-snap-align:center;opacity:.5;filter:saturate(.6)}
.a-tile:hover{opacity:.85;transform:translateY(-4px)}
.a-tile.sel{width:250px;height:296px;opacity:1;filter:none;box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--t),0 30px 60px color-mix(in srgb,var(--t) 38%,transparent)}
.a-tile-art{position:absolute;top:14px;right:14px;font-size:62px;line-height:1;transition:font-size .35s}
.a-tile.sel .a-tile-art{font-size:100px}
.a-tile-name{font:400 22px/1 Bungee,Inter,sans-serif}
.a-tile.sel .a-tile-name{font-size:30px}
.a-tile-live{font-size:12px;font-weight:700;margin-top:6px;opacity:.72}
.a-flag{position:absolute;top:16px;left:16px;font:800 10px Inter;letter-spacing:.12em;padding:4px 8px;border-radius:999px;background:#0B0B0E;color:var(--t);font-style:normal}
.a-detail{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:end}
.a-title{font:400 clamp(34px,5.2cqi,66px)/.95 Bungee,Inter,sans-serif}
.a-tagl{font-size:17px;color:var(--mu);margin:12px 0 14px}
.a-chips{display:flex;gap:8px;flex-wrap:wrap}
.a-chip{padding:6px 12px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font-size:12px;font-weight:600;color:#d8d8de}
.a-modes{display:grid;gap:10px}
.a-hold{position:relative;overflow:hidden;min-height:70px;border-radius:22px;background:var(--g);color:#0B0B0E;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;user-select:none;-webkit-user-select:none;touch-action:none;padding:8px 16px}
.a-hold::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.25);transform-origin:left;transform:scaleX(var(--h,0))}
.a-hold>*{position:relative}
.a-hold small{font-weight:600;font-size:12px;opacity:.7}
.a-hold.nudge{animation:a-nudge .4s}
@keyframes a-nudge{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.a-mode{min-height:56px;border-radius:18px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;gap:12px;padding:0 18px;font-weight:700;font-size:15px;text-align:left;transition:background .15s,border-color .15s}
.a-mode:hover{background:var(--s2);border-color:color-mix(in srgb,var(--g) 60%,transparent)}
.a-mode small{font-weight:500;color:var(--mu);font-size:12px}
.a-mode .go{margin-left:auto;color:var(--mu);display:flex}
.a-soonbox{padding:18px;border-radius:20px;border:1px dashed var(--ln);color:var(--mu);font-size:14px}
.a-soonbox b{color:var(--tx)}
.a-keys{margin-top:22px;font-size:12px;color:var(--mu);display:flex;gap:18px;flex-wrap:wrap}
.a-keys kbd{font:600 11px 'JetBrains Mono',monospace;padding:2px 6px;border-radius:5px;background:var(--s2);color:var(--tx);margin-right:4px}
.a-row{display:grid;grid-template-columns:1.15fr 1fr 1.3fr;gap:16px;margin-top:40px}
.a-panel{background:var(--s1);border:1px solid var(--ln);border-radius:26px;padding:18px;min-width:0}
.a-ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.a-ph h3{font:400 15px Bungee,Inter,sans-serif;letter-spacing:.02em}
.a-ph button{font-size:12px;color:var(--mu);font-weight:600;white-space:nowrap}
.a-ph button:hover{color:var(--tx)}
.a-quest{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;width:100%;text-align:left}
.a-quest:hover{background:var(--s1)}
.a-quest-e{width:44px;height:44px;border-radius:13px;background:var(--s2);display:grid;place-items:center;font-size:22px;flex-shrink:0}
.a-quest b{display:block;font-size:14px}
.a-quest small{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a-qbar{height:4px;border-radius:4px;background:var(--ln);margin-top:7px;overflow:hidden}.a-qbar i{display:block;height:100%;background:var(--g)}
.a-tagr{margin-left:auto;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;background:var(--g);color:#0B0B0E;white-space:nowrap}
.a-tagr.mu{background:var(--s2);color:var(--mu)}
.a-party{display:flex;flex-wrap:wrap;gap:14px}
.a-bub{display:flex;flex-direction:column;align-items:center;gap:7px;width:62px;font-size:12px;color:var(--mu)}
.a-bub .av{box-shadow:0 0 0 3px #141418,0 0 0 5px var(--ring,transparent);transition:transform .2s}
.a-bub:hover .av{transform:scale(1.08)}
.a-bub.online .av{--ring:var(--win)}.a-bub.match .av{--ring:#FFC53D}
.a-bub:hover{color:var(--tx)}
.a-bub.add .av{background:var(--s2);color:var(--tx)}
.a-caps{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px}
.a-cap{flex:0 0 96px;height:150px;border-radius:18px;background:linear-gradient(170deg,var(--c),#111 90%);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;text-align:left;font-size:12px;font-weight:700;color:#fff;overflow:hidden;transition:transform .2s}
.a-cap .e{position:absolute;top:10px;left:10px;font-size:32px}
.a-cap:hover{transform:translateY(-4px)}
.a-cap.post{background:var(--s2);border:1px dashed rgba(255,255,255,.25);align-items:center;justify-content:center;gap:8px;color:var(--mu)}
.a-caps.big .a-cap{flex-basis:130px;height:200px}
/* lobby */
.a-back{display:inline-flex;align-items:center;gap:6px;color:var(--mu);font-weight:600;font-size:13px;margin:4px 0 14px}
.a-back:hover{color:var(--tx)}
.a-banner{position:relative;border-radius:32px;padding:34px;min-height:270px;background:linear-gradient(135deg,var(--g),color-mix(in srgb,var(--g) 38%,#000));color:#0B0B0E;overflow:hidden;display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:end}

  if (C && C.vt && document.startViewTransition && location.hash !== h) {
    document.startViewTransition(() => { history.pushState(null, '', h); render(); });
    return;
  }
  if (location.hash === h) render(); else location.hash = h;
}
function parseHash() {
  const [c, r, p] = location.hash.slice(1).split('/');
  App.concept = CONCEPTS[c] ? c : 'a';
  App.route = r || 'home';
  App.param = p || null;
}

/* ---------- match engines ---------- */
function initMatch(gid, mode, oppName) {
  const g = gameById(gid);
  S.game = g.id; S.mode = mode;
  S.opp = mode === 'solo' ? BOT : (oppName ? friendByName(oppName) : pick(RANDOM_PLAYERS));
  S.rps = { me: 0, opp: 0, round: 1, last: null, target: 3, locked: false, deadline: Date.now() + 10000 };
  S.hc = { stage: 'toss', first: 'me', inn: 1, runs: { me: 0, opp: 0 }, balls: { me: 0, opp: 0 }, per: 6, last: null, ended: false, locked: false, coin: null, msg: 'Call the toss. Win it and you choose to bat or bowl.', deadline: Date.now() + 5000 };
  S.chess = { my: 300, opp: 287, turn: 'me' };
  S.result = null;
  startTick();
}
function startMatch(gid, mode, oppName) { initMatch(gid, mode, oppName); go('match', gid); }

function startTick() {
  stopTick();
  S.tick = setInterval(() => {
    if (App.route !== 'match') return;
    const now = Date.now();
    if (S.game === 'rps' && S.rps && !S.rps.locked && !S.result) {
      const left = Math.max(0, S.rps.deadline - now);
      paintTimer(left, 10000);
      if (left <= 0) rpsPlay(null);
    } else if (S.game === 'cricket' && S.hc && S.hc.stage === 'play' && !S.hc.ended && !S.hc.locked) {
      const left = Math.max(0, S.hc.deadline - now);
      paintTimer(left, 5000);
      if (left <= 0) hcThrow(null);
    } else if (S.game === 'chess' && S.chess) {
      S.chess.my = Math.max(0, S.chess.my - 0.2);
      $$('.js-myclock').forEach((e) => (e.textContent = fmtClock(S.chess.my)));
    }
  }, 200);
}
function stopTick() { if (S.tick) clearInterval(S.tick); S.tick = null; }
function paintTimer(left, total) {
  const p = left / total;
  $$('.js-timer').forEach((el) => { el.style.setProperty('--p', p.toFixed(3)); el.classList.toggle('low', p < 0.3); });
  $$('.js-timer-n').forEach((el) => (el.textContent = Math.ceil(left / 1000)));
}
const fmtClock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function rpsPlay(mid) {
  const r = S.rps; if (!r || r.locked || S.result) return;
  const opp = pick(MOVES).id;
  const out = mid == null ? 'timeout' : mid === opp ? 'draw' : BEATS[mid] === opp ? 'win' : 'loss';
  if (out === 'win') r.me++; else if (out !== 'draw') r.opp++;
  r.last = { me: mid, opp, out }; r.locked = true;
  refresh();
  if (r.me >= r.target || r.opp >= r.target) later(() => finish(r.me > r.opp, false, `${r.me}–${r.opp}`), 1500);
  else later(() => { r.locked = false; r.round++; r.last = null; r.deadline = Date.now() + 10000; refresh(); }, 1500);
}
const rpsLine = () => {
  const l = S.rps.last; if (!l) return `Round ${S.rps.round}. Lock in your move.`;
  if (l.out === 'timeout') return `Too slow! ${S.opp.name} takes the round.`;
  if (l.out === 'draw') return `Both threw ${moveById(l.me).name}. Draw.`;
  return l.out === 'win' ? `${moveById(l.me).name} beats ${moveById(l.opp).name}. Your round!` : `${moveById(l.opp).name} beats ${moveById(l.me).name}. Their round.`;
};

/* hand cricket: toss → choose → 2 innings (1 over each in the demo) */
const hcBatter = (h) => (h.inn === 1 ? h.first : h.first === 'me' ? 'opp' : 'me');
function hcToss(call) {
  const h = S.hc; const coin = Math.random() < 0.5 ? 'heads' : 'tails';
  h.coin = coin;
  if (call === coin) { h.stage = 'choose'; h.msg = `It's ${coin}. You won the toss!`; }
  else { h.first = Math.random() < 0.5 ? 'me' : 'opp'; h.msg = `It's ${coin}. ${S.opp.name} won the toss and chose to ${h.first === 'opp' ? 'bat' : 'bowl'}.`; h.stage = 'ready'; }
  refresh();
}
function hcStart(first) {
  const h = S.hc; if (first) h.first = first;
  h.stage = 'play'; h.deadline = Date.now() + 5000;
  h.msg = hcBatter(h) === 'me' ? 'You\'re batting. Throw before the clock runs out.' : `${S.opp.name} is batting. Match their number to bowl them out.`;
  refresh();
}
function hcThrow(n) {
  const h = S.hc; if (!h || h.stage !== 'play' || h.ended || h.locked) return;
  const b = 1 + Math.floor(Math.random() * 6);
  const bat = hcBatter(h);
  const oppName = S.opp.name;
  let inningsOver = false;
  h.last = { me: n, opp: b, out: false };
  h.balls[bat]++;
  if (bat === 'me') {
    if (n == null) h.msg = 'No throw in time. Dot ball.';
    else if (n === b) { h.last.out = true; inningsOver = true; h.msg = `OUT! You both threw ${n}.`; }
    else { h.runs.me += n; h.msg = `${n} run${n > 1 ? 's' : ''}!${n >= 4 ? ' Lovely shot.' : ''}`; }
  } else {
    if (n != null && n === b) { h.last.out = true; inningsOver = true; h.msg = `WICKET! You matched ${b}.`; }
    else { h.runs.opp += b; h.msg = n == null ? `No throw in time. ${oppName}'s ${b} counts.` : `${oppName} threw ${b} and scores ${b}.`; }
  }
  if (h.balls[bat] >= h.per) inningsOver = true;
  const other = bat === 'me' ? 'opp' : 'me';
  if (h.inn === 2 && h.runs[bat] > h.runs[other]) inningsOver = true;
  if (inningsOver && h.inn === 1) { h.inn = 2; h.msg += ` Innings over. ${other === 'me' ? 'You need' : oppName + ' needs'} ${h.runs[bat] + 1}.`; }
  else if (inningsOver) h.ended = true;
  h.locked = true;
  refresh();
  later(() => {
    if (h.ended) finish(h.runs.me > h.runs.opp, h.runs.me === h.runs.opp, `${h.runs.me}–${h.runs.opp}`);
    else { h.locked = false; h.deadline = Date.now() + 5000; refresh(); }
  }, h.ended ? 1600 : 1000);
}

function finish(win, tie, score) {
  stopTick();
  S.result = { win, tie, score, game: S.game, opp: S.opp, solo: S.mode === 'solo' };
  if (!win && !tie && !S.result.solo) { const c = pick(DATA.dareCats); const it = pick(c.items); S.owed = { who: S.opp.name, cat: c.name, emoji: c.emoji, text: `${it[0]} (${it[1]}s)`, hours: 24, accepted: false }; }
  S.pick = { cat: null, item: null, vis: 'private' };
  go('result');
}

/* fill state when a screen is opened directly from the menu or a reload */
function ensureState() {
  const r = App.route;
  if (r === 'match' && (!S.game || S.game !== (App.param || 'rps') || S.result)) initMatch(App.param || 'rps', App.param === 'cricket' ? 'solo' : 'friend', App.param === 'cricket' ? null : 'Arjun');
  if (r !== 'match') stopTick();
  if (r === 'result' && !S.result) { S.opp = friendByName('Arjun'); S.result = { win: true, tie: false, score: '3–1', game: 'rps', opp: S.opp, solo: false }; }
  if (r === 'result' && !S.result.win && !S.result.tie && !S.result.solo && S.owed && !S.owed.picked) later(() => { S.owed.picked = true; toast(`${S.owed.who} picked your dare`, S.owed.emoji); refresh(); }, 2200);
  if (r === 'dare' && !S.result) { S.opp = friendByName('Arjun'); S.result = { win: true, tie: false, score: '3–1', game: 'rps', opp: S.opp, solo: false }; }
  if (r === 'record') { if (!S.owed) S.owed = { ...DATA.dares[0] }; if (!S.rec || App.lastRoute !== 'record') S.rec = { state: 'idle', t: 0, vis: 'private' }; }
  if (r === 'review' && (!S.rev || App.lastRoute !== 'review')) S.rev = { state: 'ready', d: DATA.dares[1] };
}

/* ---------- render ---------- */
function render() {
  parseHash();
  clearTimers();
  ensureState();
  const C = CONCEPTS[App.concept];
  const app = $('#app');
  app.className = 'app app-' + App.concept;
  app.innerHTML = C.render(App.route, App.param);
  const page = app.querySelector('.page');
  const key = App.concept + App.route + App.param;
  if (page && App.lastKey !== key) page.classList.add('page-enter');
  app.querySelectorAll('.scroll').forEach((s) => (s.scrollTop = 0));
  C.mount && C.mount(app, App.route, App.param);
  App.lastRoute = App.route;
  App.lastKey = key;
  renderPill();
  syncToolbar();
}
function refresh() {
  const C = CONCEPTS[App.concept];
  const app = $('#app');
  const sc = [...app.querySelectorAll('.scroll')].map((s) => s.scrollTop);
  app.innerHTML = C.render(App.route, App.param);
  app.querySelectorAll('.scroll').forEach((s, i) => (s.scrollTop = sc[i] || 0));
  C.mount && C.mount(app, App.route, App.param, true);
  renderPill();
}

const PALETTE = [
  ['Home', 'home'], ['Rock Paper Scissors', 'game', 'rps'], ['Speed Chess', 'game', 'chess'], ['Hand Cricket', 'game', 'cricket'],
  ['Quick match (RPS)', 'queue', 'rps'], ['Friends', 'friends'], ['Chat & Stories', 'social'], ['Dares inbox', 'dares'], ['Profile & stats', 'profile'], ['Record my dare', 'record'], ['Review a dare', 'review'],
];
function openPalette() {
  openOverlay(`<div class="palette" role="dialog" aria-label="Command palette"><input class="pal-in" placeholder="Jump to a game, friend or screen…" aria-label="Search"><div class="pal-list"></div><div class="pal-foot"><span>↑↓ to move</span><span>↵ to open</span><span>esc to close</span></div></div>`, 'ov-palette');
  const inp = $('.pal-in'); const list = $('.pal-list'); let sel = 0; let items = [];
  const draw = () => {
    const q = inp.value.toLowerCase();
    items = PALETTE.filter((p) => p[0].toLowerCase().includes(q)).concat(DATA.friends.filter((f) => q && f.name.toLowerCase().includes(q)).map((f) => [`Challenge ${f.name}`, '__challenge', f.name]));
    sel = Math.min(sel, Math.max(0, items.length - 1));
    list.innerHTML = items.map((p, i) => `<button class="pal-item ${i === sel ? 'sel' : ''}" data-i="${i}">${esc(p[0])}<small>${p[1] === '__challenge' ? 'friend' : p[1]}</small></button>`).join('') || '<p class="pal-empty">Nothing found</p>';
  };
  const run = (i) => { const p = items[i]; if (!p) return; if (p[1] === '__challenge') { closeOverlay(); challengeSheet(p[2]); } else go(p[1], p[2]); };
  inp.addEventListener('input', () => { sel = 0; draw(); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, items.length - 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); draw(); e.preventDefault(); }
    if (e.key === 'Enter') run(sel);
  });
  list.addEventListener('click', (e) => { const b = e.target.closest('.pal-item'); if (b) run(+b.dataset.i); });
  draw(); setTimeout(() => inp.focus(), 30);
}

  'chess-win': () => finish(true, false, '1–0'),
  'pick-dare': (el) => { if (S.pick.cat !== el.dataset.id) S.pick.item = null; S.pick.cat = el.dataset.id; refresh(); },
  'pick-item': (el) => { S.pick.item = +el.dataset.i; refresh(); },
  'dare-vis': (el) => { S.pick.vis = el.dataset.v; refresh(); },
  'send-dare': () => { const o = (S.result && S.result.opp) || { name: 'Arjun' }; toast(`Dare sent to ${o.name}. They have 24 hours.`, '🎯'); go('home'); },
  toss: (el) => hcToss(el.dataset.c),
  'hc-first': (el) => hcStart(el.dataset.f),
  'accept-dare': () => { S.owed.accepted = true; toast('Dare accepted. 24 hours on the clock.', '⏱'); refresh(); },
  'decline-dare': () => { toast(`Dare declined. ${S.owed.who} will be told.`, '✕'); S.owed = null; go('home'); },
  'rec-start': () => { S.rec = { ...S.rec, state: 'rec', t: 0 }; refresh(); every(() => { S.rec.t += 0.3; if (S.rec.t >= 10) { S.rec.t = 10; S.rec.state = 'done'; clearTimers(); } refresh(); }, 100); },
  'rec-retake': () => { S.rec = { state: 'idle', t: 0, vis: S.rec.vis }; refresh(); },
  vis: (el) => { S.rec.vis = el.dataset.v; refresh(); },
  'rec-submit': () => { toast(S.rec.vis === 'public' ? 'Submitted. It goes to stories once approved.' : `Submitted privately to ${S.owed.who}.`, '🎬'); S.owed = null; go('home'); },
  'rev-play': () => { S.rev.state = 'playing'; refresh(); later(() => { S.rev.state = 'watched'; refresh(); }, 3500); },
  'rev-ok': () => { toast('Approved. It\'s on their story for 24h.', '👍'); go('home'); },
  'rev-retry': () => { toast('Retry requested. They get one more go.', '↺'); go('home'); },
  story: (el) => openStory(el.dataset.i),
  'story-step': (el) => openStory.step && openStory.step(+el.dataset.d),
  react: (el, e) => { emojiBurst(e.clientX, e.clientY, el.dataset.e || '🔥'); const n = el.querySelector('span'); if (n) n.textContent = +n.textContent + 1; },
  copy: () => { try { navigator.clipboard.writeText('https://evoaiqu.app/invite/monesh-7K2Q9'); } catch (e) { /* file:// may block clipboard */ } toast('Invite link copied'); },
  accept: (el) => { const i = DATA.requests.findIndex((r) => r.name === el.dataset.f); if (i > -1) { const r = DATA.requests.splice(i, 1)[0]; DATA.friends.unshift({ ...r, status: 'online', h2h: [0, 0], fav: 'RPS' }); } toast(`You and ${el.dataset.f} are now friends`); refresh(); },
  decline: (el) => { const i = DATA.requests.findIndex((r) => r.name === el.dataset.f); if (i > -1) DATA.requests.splice(i, 1); toast('Request declined', '✕'); refresh(); },
  add: (el) => { el.disabled = true; el.textContent = 'Requested'; toast(`Friend request sent to ${el.dataset.f}`); },
  tab: (el) => { S.tabs[el.dataset.group || App.route] = el.dataset.tab; refresh(); },
  lang: () => toast('தமிழ் selected (mock)', 'அ'),
  logout: () => toast('Signed out (mock)', '→'),
  'bg-queue': (el) => bgQueue(el.dataset.g || 'rps'),
  'bg-cancel': () => { cancelBg(); toast('Left the queue', '✕'); },
  'bg-join': () => { const g = S.bg.gid; cancelBg(); startMatch(g, 'quick'); },
  'cancel-queue': () => { go('game', App.param || 'rps'); toast('Left the queue', '✕'); },
  'copy-id': () => { try { navigator.clipboard.writeText(DATA.me.id); } catch (e) { /* ignore */ } toast(`${DATA.me.id} copied`); },
  'share-wa': () => toast('Opens WhatsApp with your invite link (mock)', '↗'),
  nudge: (el) => toast(`Nudged ${el.dataset.f}. They'll get a reminder.`, '👋'),
  notify: () => toast('We\'ll tell you when Mystery Dare Duel launches', '🔔'),
  block: (el) => { closeOverlay(); toast(`${el.dataset.f} blocked (mock)`, '⛔'); },
  'edit-profile': () => toast('Opens the profile editor (mock)', '✎'),
  'toggle-vis': (el) => { const pub = el.textContent.trim() === 'Public'; el.textContent = pub ? 'Private' : 'Public'; toast(pub ? 'Profile is now private' : 'Profile is now public', '🔒'); },
  blocked: () => toast('Opens your blocked list (mock)', '⛔'),
  'delete-acc': () => toast('Asks you to type DELETE to confirm (mock)', '⚠'),
  'leave-match': () => {
    if (S.mode === 'solo' || S.result) { stopTick(); go('game', S.game); return; }
    openSheet('Leave the match?', `<p class="sheet-sub">Leaving now counts as a forfeit, and ${esc(S.opp.name)} wins.</p><div class="r-actions"><button class="r-btn" data-act="close-ov">Keep playing</button><button class="r-btn pri" data-act="forfeit">Forfeit &amp; leave</button></div>`);
  },

  send: () => { const i = $('.js-msg'); if (i && i.value.trim()) { DATA.thread.push({ me: true, t: i.value.trim() }); refresh(); later(() => { DATA.thread.push({ me: false, t: pick(['haha', 'you\'re on 😤', 'gg', 'ok but rematch first']) }); refresh(); }, 900); } },
};

document.addEventListener('click', (e) => {
  const inFrame = e.target.closest('#frame');
  if (!inFrame) return;
  const goEl = e.target.closest('[data-go]');
  const actEl = e.target.closest('[data-act]');
  if (actEl && (!goEl || actEl.contains(goEl) === false && goEl.contains(actEl))) {
    if (actEl.disabled) return;
    const C = CONCEPTS[App.concept];
    const fn = (C.acts && C.acts[actEl.dataset.act]) || ACTS[actEl.dataset.act];
    if (fn) { e.preventDefault(); fn(actEl, e); }
    return;
  }
  if (goEl && !goEl.disabled) { e.preventDefault(); go(goEl.dataset.go, goEl.dataset.param); }
});
document.addEventListener('input', (e) => { if (e.target.classList.contains('js-custom')) S.pick.custom = e.target.value; });
document.addEventListener('keydown', (e) => {
  const C = CONCEPTS[App.concept];
  const typing = /input|textarea/i.test(e.target.tagName);
  if (e.key === 'Escape') { closeOverlay(); closeMenus(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && C.palette) { e.preventDefault(); openPalette(); return; }
  if (typing) { if (e.key === 'Enter' && e.target.classList.contains('js-msg')) ACTS.send(); return; }
  if (App.route === 'match' && !$('#overlay').innerHTML) {
    if (S.game === 'rps' && ['1', '2', '3'].includes(e.key)) rpsPlay(MOVES[+e.key - 1].id);
    if (S.game === 'cricket' && /^[1-6]$/.test(e.key)) hcThrow(+e.key);
  }
  C.onKey && C.onKey(e);
});

/* ---------- preview toolbar ---------- */
const SCREENS = [
  ['Start', [['Home', 'home'], ['Friends', 'friends'], ['Chat & Stories', 'social'], ['Dares inbox', 'dares'], ['Profile & settings', 'profile']]],
  ['Play flow', [['Game: Rock Paper Scissors', 'game', 'rps'], ['Game: Hand Cricket', 'game', 'cricket'], ['Matchmaking queue', 'queue', 'rps'], ['Match: RPS (playable)', 'match', 'rps'], ['Match: Hand Cricket (playable)', 'match', 'cricket'], ['Match: Speed Chess', 'match', 'chess']]],
  ['After the match', [['Result: you won', 'result', 'win'], ['Result: you lost', 'result', 'loss'], ['Pick a dare', 'dare'], ['Record your dare', 'record'], ['One-time winner review', 'review']]],
];
function syncToolbar() {
  $$('#conceptSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.c === App.concept));
  const C = CONCEPTS[App.concept];
  const i = C.info;
  $('#info').innerHTML = `<button class="x" data-close-info aria-label="Close">✕</button><h3>${esc(i.name)}</h3><p class="tag">${esc(i.tag)}</p><dl>
    <div><dt>Layout</dt><dd>${esc(i.layout)}</dd></div>
    <div><dt>Navigation</dt><dd>${esc(i.nav)}</dd></div>
    <div><dt>Signature interactions</dt><dd><ul>${i.interactions.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></dd></div>
    <div><dt>Type</dt><dd>${esc(i.fonts)}</dd></div>
    <div><dt>Palette</dt><dd class="sw">${i.palette.map((c) => `<i style="background:${c}" title="${c}"></i>`).join('')}</dd></div>
    <div><dt>Best for</dt><dd>${esc(i.best)}</dd></div></dl>`;
}
function closeMenus() { $('#screensMenu').classList.remove('open'); $('#info').classList.remove('open'); $('#screensBtn').setAttribute('aria-expanded', 'false'); $('#infoBtn').setAttribute('aria-expanded', 'false'); }
function initToolbar() {
  $('#conceptSeg').innerHTML = Object.entries(CONCEPTS).map(([k, c]) => `<button data-c="${k}" aria-pressed="false">${k.toUpperCase()} · ${esc(c.info.short)}</button>`).join('');
  $('#conceptSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    closeOverlay();
    App.concept = b.dataset.c;
    location.hash = '#' + b.dataset.c + '/' + (App.route || 'home') + (App.param ? '/' + App.param : '');
  });
  $('#deviceSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    App.device = b.dataset.device;
    $('#stage').classList.toggle('mobile', App.device === 'mobile');
    $$('#deviceSeg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  });
  $('#screensMenu').innerHTML = SCREENS.map(([h, items]) => `<h4>${h}</h4>${items.map(([l, r, p]) => `<button data-r="${r}" data-p="${p || ''}">${l}</button>`).join('')}`).join('');
  $('#screensMenu').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const r = b.dataset.r, p = b.dataset.p;
    closeMenus(); closeOverlay();
    if (r === 'result') {
      const o = friendByName('Arjun'); S.opp = o; S.game = 'rps';
      S.result = p === 'win' ? { win: true, tie: false, score: '3–1', game: 'rps', opp: o, solo: false } : { win: false, tie: false, score: '1–3', game: 'rps', opp: o, solo: false };
      if (p === 'loss') S.owed = { who: 'Arjun', cat: 'Dance', emoji: '💃', text: 'A signature move or viral groove', hours: 24 };
      go('result'); return;
    }
    if (r === 'match') { initMatch(p, p === 'cricket' ? 'solo' : 'friend', p === 'cricket' ? null : 'Arjun'); }
    go(r, p || undefined);
  });
  $('#screensBtn').addEventListener('click', (e) => { e.stopPropagation(); const open = !$('#screensMenu').classList.contains('open'); closeMenus(); $('#screensMenu').classList.toggle('open', open); $('#screensBtn').setAttribute('aria-expanded', open); });
  $('#infoBtn').addEventListener('click', (e) => { e.stopPropagation(); const open = !$('#info').classList.contains('open'); closeMenus(); $('#info').classList.toggle('open', open); $('#infoBtn').setAttribute('aria-expanded', open); });
  $('#info').addEventListener('click', (e) => { if (e.target.closest('[data-close-info]')) closeMenus(); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.tb-menu,.info,.tb')) closeMenus(); });
}
</script>

      ${full ? '' : `<header class="a-top">
        <button class="a-me" data-go="profile">${av(DATA.me, 38)}<span><b>${DATA.me.name}</b><small>Lv 14 · Gold II <span class="a-xp"><i></i></span></small></span></button>
        <div class="a-top-r">
          <button class="a-ibtn" data-act="palette" aria-label="Search (Ctrl K)">${ic('search', 18)}<span class="lbl">Search</span><kbd>Ctrl K</kbd></button>
          <button class="a-ibtn" data-go="friends" aria-label="Friends online">${ic('users', 18)}<span class="lbl">${DATA.friends.filter((f) => f.status !== 'offline').length} online</span></button>
          <button class="a-ibtn" data-go="dares" aria-label="${dareNeedsYou()} dares need you">${ic('bell', 18)}<i class="a-badge">${dareNeedsYou()}</i></button>
          <span class="a-clock">${clock()}</span>
        </div></header>`}
      <main class="a-main scroll hide-sb ${full ? 'full' : ''}"><div class="page">${content}</div></main>
      ${full ? '' : `<nav class="a-dock" aria-label="Main">${NAV.map(([k, i, l]) => `<button data-go="${k}" class="${act === k ? 'on' : ''}" aria-label="${l}" ${act === k ? 'aria-current="page"' : ''}>${ic(i, 22)}<span class="tip">${l}</span>${k === 'dares' ? `<i class="a-badge">${dareNeedsYou()}</i>` : ''}</button>`).join('')}</nav>`}
    </div>`;
  }

  function modes(g, inBanner) {
    if (g.soon) return `<div class="a-soonbox"><b>Coming soon.</b> Random party mini-games where the loser records a dare on the spot.</div><button class="a-mode" data-act="notify">${ic('bell')} Notify me when it launches</button>`;
    let h = '';
    if (g.modes.includes('quick')) h += `<button class="a-hold" data-hold="${g.id}" aria-label="Press and hold to start a quick match">${ic('bolt', 22)}<span>Hold for quick match</span><small>random opponent</small></button>`;
    else if (g.modes.includes('solo')) h += `<button class="a-hold" data-act="start" data-g="${g.id}" data-mode="solo">${ic('bot', 22)}<span>Play solo vs EVO Bot</span><small>nothing is saved</small></button>`;
    if (g.modes.includes('friend')) h += `<button class="a-mode" data-act="a-friendpick" data-g="${g.id}">${ic('swords')}<span>Challenge a friend<br><small>winner picks the dare</small></span><span class="go">${ic('chev', 18)}</span></button>`;
    if (!inBanner) h += `<button class="a-mode" data-go="game" data-param="${g.id}">${ic('grid')}<span>Lobby, rules &amp; invites</span><span class="go">${ic('chev', 18)}</span></button>`;
    return h;
  }

  const questTitle = (d) => d.kind === 'owe' ? `Do ${d.who}'s ${d.cat} dare` : d.kind === 'review' ? `Review ${d.who}'s ${d.cat}` : `${d.who} owes you ${d.cat}`;
  const questRow = (d) => `<button class="a-quest" data-go="${d.kind === 'review' ? 'review' : d.kind === 'owe' ? 'record' : 'dares'}"><span class="a-quest-e">${d.emoji}</span><span style="min-width:0;flex:1"><b>${esc(questTitle(d))}</b><small>${esc(d.text)}</small>${d.hours ? `<div class="a-qbar"><i style="width:${(d.hours / 24) * 100}%"></i></div>` : ''}</span><span class="a-tagr ${d.kind === 'waiting' ? 'mu' : ''}">${d.kind === 'owe' ? d.hours + 'h left' : d.kind === 'review' ? 'Review' : 'Waiting'}</span></button>`;

  function home() {
    const g = DATA.games[sel];
    const hr = new Date().getHours();
    const greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
    const online = DATA.friends.filter((f) => f.status !== 'offline');
    return `<p class="a-hello">${greet}, ${DATA.me.name} · <b>${DATA.me.streak}-win streak</b> · ${dareNeedsYou()} dares need you</p>
      <div class="a-shelf hide-sb" role="listbox" aria-label="Games">${DATA.games.map((x, i) => `<button class="a-tile ${i === sel ? 'sel' : ''}" role="option" aria-selected="${i === sel}" data-act="a-sel" data-i="${i}" style="--t:${GAME_COLORS[x.id]}">${x.isNew ? '<i class="a-flag">NEW</i>' : ''}${x.soon ? '<i class="a-flag">SOON</i>' : ''}<span class="a-tile-art">${x.emoji}</span><span class="a-tile-name">${x.short}</span><span class="a-tile-live">${x.soon ? 'In development' : `● ${x.live} playing now`}</span></button>`).join('')}</div>
      <div class="a-detail">
        <div><h1 class="a-title">${esc(g.name)}</h1><p class="a-tagl">${esc(g.tagline)}</p><div class="a-chips">${g.meta.map((m) => `<span class="a-chip">${esc(m)}</span>`).join('')}</div></div>
        <div class="a-modes">${modes(g)}</div>
      </div>
      <div class="a-keys"><span><kbd>←</kbd><kbd>→</kbd>browse games</span><span><kbd>Enter</kbd>open lobby</span><span><kbd>Ctrl</kbd><kbd>K</kbd>jump anywhere</span></div>
      <div class="a-row">
        <section class="a-panel"><div class="a-ph"><h3>Dares</h3><button data-go="dares">Open log →</button></div>${DATA.dares.map(questRow).join('')}</section>
        <section class="a-panel"><div class="a-ph"><h3>Party · ${online.length} online</h3><button data-go="friends">All →</button></div><div class="a-party">${DATA.friends.slice(0, 7).map((f) => `<button class="a-bub ${f.status}" data-act="a-friend" data-f="${f.name}">${av(f, 48)}<span>${f.name}</span></button>`).join('')}<button class="a-bub add" data-act="copy"><span class="av" style="--s:48px">+</span><span>Invite</span></button></div></section>
        <section class="a-panel"><div class="a-ph"><h3>Stories</h3><button data-go="social">All →</button></div><div class="a-caps hide-sb"><button class="a-cap post" data-go="record">${ic('video', 22)}<span>Post dare</span></button>${DATA.stories.map((s, i) => `<button class="a-cap" style="--c:${s.color}" data-act="story" data-i="${i}"><span class="e">${s.emoji}</span>${s.name}<span style="opacity:.7;font-weight:500">${s.ago} ago</span></button>`).join('')}</div></section>
      </div>`;
  }

  function lobby(id) {
    const g = gameById(id);
    if (g.soon) return `<button class="a-back" data-go="home">${ic('back', 16)} All games</button><section class="a-banner"><span class="art">${g.emoji}</span><div><h1>${esc(g.name)}</h1><p>${esc(g.tagline)}</p></div><div class="a-modes">${modes(g, true)}</div></section>`;
    const tc = S.tabs.chessTime ?? 1, col = S.tabs.chessCol ?? 'Random';
    const inv = { rps: [['Arjun', 'wants a rematch · expires in 1:40', 'Accept']], chess: [['Priya', 'Blitz 5+3 · your move', 'Open']], cricket: [['Rahul', 'challenged you · expires in 4:12', 'Accept & play']] }[id] || [];
    const fr = DATA.friends.filter((f) => f.status !== 'offline');
    const rec = { rps: ['36', '64%', '5–3'], chess: ['23', '48%', '1–0'], cricket: ['12', '67%', '48–31'] }[id];
    return `<button class="a-back" data-go="home">${ic('back', 16)} All games</button>
      <section class="a-banner"><span class="art">${g.emoji}</span><div><h1>${esc(g.name)}</h1><p>${esc(g.meta.join(' · '))} · ${g.online} online</p></div><div class="a-modes">${modes(g, true)}</div></section>
      <div class="a-cols">
        <section class="a-panel"><div class="a-ph"><h3>How it works</h3></div><div class="a-steps">${g.rules.map((r, i) => `<div class="a-step"><b>0${i + 1}</b>${esc(r)}</div>`).join('')}</div>
          ${id === 'chess' ? `<div class="a-ph" style="margin-top:18px"><h3>Game settings</h3></div><div class="a-seg">${DATA.chessTimes.map((t, i) => `<button class="${tc === i ? 'sel' : ''}" data-act="a-set" data-k="chessTime" data-v="${i}" aria-pressed="${tc === i}">${t[0]}<small>${t[1]}</small></button>`).join('')}</div><div class="a-seg" style="margin-top:8px">${['Random', 'White', 'Black'].map((c) => `<button class="${col === c ? 'sel' : ''}" data-act="a-set" data-k="chessCol" data-v="${c}" aria-pressed="${col === c}">${c}</button>`).join('')}</div>` : ''}
        </section>
        <section class="a-panel"><div class="a-ph"><h3>Invites</h3></div>${inv.map(([w, t, b]) => `<div class="a-inv">${av(friendByName(w), 40)}<div style="flex:1;min-width:0"><b>${w}</b><small>${t}</small></div><button class="a-btn" data-act="start" data-g="${id}" data-mode="friend" data-f="${w}">${b}</button></div>`).join('')}
          <div class="a-ph" style="margin-top:14px"><h3>Online now</h3></div>${fr.map((f) => `<div class="a-row2">${av(f, 36)}<div><b>${f.name}</b><small>${statusText(f)}</small></div><button class="a-btn ghost" data-act="start" data-g="${id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>Challenge</button></div>`).join('')}
          <div class="a-stat3"><div><b>${rec[0]}</b><small>Played</small></div><div><b>${rec[1]}</b><small>Win rate</small></div><div><b>${rec[2]}</b><small>Best</small></div></div>
        </section>
      </div>`;
  }

  function queue(id) {
    const g = gameById(id);
    if (qFound) {
      const o = RANDOM_PLAYERS[0];
      return `<div class="a-queue"><div><div class="a-vs"><div class="p l">${av(DATA.me, 110)}You</div><div class="x">VS</div><div class="p r">${av(o, 110)}${esc(o.name)}</div></div><p style="margin-top:22px">Match found. Get ready…</p></div></div>`;
    }
    return `<div class="a-queue"><div>
      <div class="a-radar"><i></i><i></i><i></i><div class="a-sweep"></div><span class="a-blip" style="top:22%;left:70%"></span><span class="a-blip" style="top:68%;left:24%;animation-delay:.7s"></span>${av(DATA.me, 84)}</div>
      <h2>Finding an opponent</h2><p>${esc(g.name)} · ${esc(g.meta.slice(0, 2).join(' · '))} · fair pairing</p>
      <div class="a-qt">0:00</div>
      <div class="a-qbtns"><button class="r-btn" data-act="bg-queue" data-g="${g.id}">${ic('grid', 18)} Keep browsing</button><button class="r-btn" data-act="cancel-queue">Cancel</button></div>
    </div></div>`;
  }

  const fcard = (f) => `<button class="a-fcard ${f.status}" data-act="a-friend" data-f="${f.name}" data-name="${esc((f.name + ' ' + f.id).toLowerCase())}">${av(f, 64)}<b>${f.name}</b><small>${statusText(f)}</small><span class="a-h2h">${f.h2h[0]}–${f.h2h[1]} vs you</span></button>`;
  function friends() {
    const on = DATA.friends.filter((f) => f.status !== 'offline'), off = DATA.friends.filter((f) => f.status === 'offline');
    return `<h1 class="a-h1">Your party</h1><p class="a-sub">${on.length} online · ${DATA.friends.length} friends · your ID <b style="font-family:'JetBrains Mono'">${DATA.me.id}</b></p>
      <div class="a-toolbar"><label class="a-search">${ic('search', 18)}<input class="js-fsearch" placeholder="Search friends or find a player by EVO-ID" aria-label="Search friends"></label><button class="a-btn" style="min-height:48px;border-radius:16px" data-act="copy">${ic('link', 18)} Copy invite link</button><button class="a-btn ghost" style="min-height:48px;border-radius:16px" data-act="share-wa">WhatsApp</button></div>
      ${DATA.requests.length ? `<div class="a-sec">Requests · ${DATA.requests.length}</div><div class="a-req">${DATA.requests.map((r) => `<div class="a-reqc">${av(r, 40)}<div><b>${r.name}</b><small>${r.mutual} mutual friends</small></div><button class="a-btn" data-act="accept" data-f="${r.name}">${ic('check', 16)}Accept</button><button class="a-btn ghost" data-act="decline" data-f="${r.name}" aria-label="Decline ${r.name}">${ic('x', 16)}</button></div>`).join('')}</div>` : ''}
      <div class="a-sec">Online now</div><div class="a-fgrid">${on.map(fcard).join('')}</div>
      <div class="a-sec">Offline</div><div class="a-fgrid">${off.map(fcard).join('')}</div>
      <div class="a-sec">People you may know</div><div class="a-fgrid">${DATA.suggestions.map((s) => `<div class="a-fcard">${av(s, 56)}<b>${s.name}</b><small>${s.mutual} mutual friends</small><button class="a-btn ghost" data-act="add" data-f="${s.name}">${ic('plus', 16)} Add</button></div>`).join('')}</div>`;
  }

  function dares() {
    const card = (d) => `<div class="a-qcard ${d.kind !== 'waiting' ? 'hot' : ''}"><span class="a-quest-e">${d.emoji}</span><div style="min-width:0;flex:1"><b>${esc(questTitle(d))}</b><p>${esc(d.text)}</p><div class="meta">From your ${esc(d.game)} match · ${d.kind === 'owe' ? `${d.hours}h left to record` : d.kind === 'review' ? 'Submitted · you can watch it once' : `they have ${d.hours}h left`}</div>${d.hours ? `<div class="a-qbar"><i style="width:${(d.hours / 24) * 100}%"></i></div>` : ''}</div><div class="act">${d.kind === 'owe' ? `<button class="a-btn" data-go="record">${ic('video', 16)} Record</button>` : d.kind === 'review' ? `<button class="a-btn" data-go="review">${ic('play', 14)} Watch once</button>` : `<button class="a-btn ghost" data-act="nudge" data-f="${d.who}">Nudge</button>`}</div></div>`;
    return `<h1 class="a-h1">Dare log</h1><p class="a-sub">Every dare in one place: what you owe, what to review, and what friends owe you.</p>
      <div class="a-sec">Needs you</div><div class="a-qlist">${DATA.dares.filter((d) => d.kind !== 'waiting').map(card).join('')}</div>
      <div class="a-sec">Waiting on friends</div><div class="a-qlist">${DATA.dares.filter((d) => d.kind === 'waiting').map(card).join('')}</div>
      <div class="a-sec">Completed</div><div class="a-qlist"><div class="a-qcard done"><span class="a-quest-e">🎤</span><div style="flex:1"><b>You sang for Vikram</b><p>Approved yesterday · posted to stories</p></div></div><div class="a-qcard done"><span class="a-quest-e">🎭</span><div style="flex:1"><b>Priya's mimicry for you</b><p>Approved 2 days ago</p></div></div></div>`;
  }

  function social() {
    const cur = S.tabs.chat, show = cur || 'Arjun', f = friendByName(show);
    return `<h1 class="a-h1">Chat &amp; Stories</h1><p class="a-sub">Dare stories disappear after 24 hours.</p>
      <div class="a-caps big hide-sb" style="margin-bottom:18px"><button class="a-cap post" data-go="record">${ic('video', 24)}<span>Post your dare</span></button>${DATA.stories.map((s, i) => `<button class="a-cap" style="--c:${s.color}" data-act="story" data-i="${i}"><span class="e">${s.emoji}</span>${s.name}<span style="opacity:.75;font-weight:500">${esc(s.cat)} · ${s.ago}</span></button>`).join('')}</div>
      <div class="a-soc ${cur ? 'has-thread' : ''}">
        <div class="a-chats">${DATA.chats.map((c) => `<button class="a-chat ${c.name === show ? 'sel' : ''}" data-act="a-chat" data-f="${c.name}">${av(friendByName(c.name), 44)}<div style="min-width:0"><b>${c.name}</b><small>${esc(c.last)}</small></div><span class="t">${c.time}${c.unread ? `<span class="u">${c.unread}</span>` : ''}</span></button>`).join('')}</div>
        <div class="a-thread"><div class="a-th-head"><button class="a-leave a-th-back" data-act="a-chatback" aria-label="Back to chats">${ic('back', 16)}</button>${av(f, 40)}<div><b>${f.name}</b><small>${statusText(f)}</small></div><button class="a-btn" data-act="challenge" data-f="${f.name}">${ic('swords', 16)}<span>Challenge</span></button></div>
          ${show === 'Arjun' ? `<div class="a-dare-banner">💃 You owe Arjun a Dance dare · 18h left<button class="a-btn" data-go="record">Record</button></div>` : ''}
          <div class="a-msgs">${DATA.thread.map((m) => `<div class="a-msg ${m.me ? 'me' : ''}">${esc(m.t)}</div>`).join('')}</div>
          <div class="a-compose"><input class="js-msg" placeholder="Message ${f.name}…" aria-label="Message ${f.name}"><button class="a-btn" style="min-height:44px" data-act="send" aria-label="Send">${ic('send', 18)}</button></div>
        </div>
      </div>`;
  }

  function profile() {
    const t = S.tabs.profile || 'history', me = DATA.me;
    const hist = `<div class="a-hist">${DATA.history.map((h) => `<div class="a-hrow"><span class="a-res ${h.res}">${h.res}</span>${av(friendByName(h.opp), 36)}<div><b>vs ${h.opp} · ${h.game}</b><small>${h.note} · ${h.ago}</small></div><span class="sc">${h.score}</span></div>`).join('')}</div>`;
    const stats = `<div class="a-bars">${[['Rock Paper Scissors', 64, '23–13', GAME_COLORS.rps], ['Speed Chess', 48, '11–12', GAME_COLORS.chess], ['Hand Cricket', 67, '8–4', GAME_COLORS.cricket]].map(([n, p, wl, c]) => `<div class="a-barrow"><span>${n}</span><span class="tr"><i style="width:${p}%;background:${c}"></i></span><span>${p}% · ${wl}</span></div>`).join('')}</div>`;
    const set = `<div class="a-set">
      <div class="a-setrow">${ic('user')}<div><b>Name, bio &amp; avatar</b><small>${me.name} · "${esc(me.bio.slice(0, 32))}…"</small></div><div class="r"><button class="a-btn ghost" data-act="edit-profile">Edit</button></div></div>
      <div class="a-setrow">${ic('globe')}<div><b>Language</b><small>English or தமிழ்</small></div><div class="r a-seg" style="padding:3px"><button class="sel">EN</button><button data-act="lang">தமிழ்</button></div></div>
      <div class="a-setrow">${ic('lock')}<div><b>Profile visibility</b><small>Public: anyone can find you by EVO-ID</small></div><div class="r"><button class="a-btn ghost" data-act="toggle-vis">Public</button></div></div>
      <div class="a-setrow">${ic('shield')}<div><b>Blocked players</b><small>2 blocked</small></div><div class="r"><button class="a-btn ghost" data-act="blocked">Manage</button></div></div>
      <div class="a-setrow">${ic('logout')}<div><b>Sign out</b><small>${me.id}</small></div><div class="r"><button class="a-btn ghost" data-act="logout">Sign out</button></div></div>
      <div class="a-setrow danger">${ic('x')}<div><b>Delete account</b><small>Permanently removes your profile, matches and stories</small></div><div class="r"><button class="a-btn ghost" data-act="delete-acc">Delete…</button></div></div></div>`;
    return `<div class="a-prof">
      <div class="a-card"><span class="rank">🏆 Gold II · Lv 14</span><div style="margin-top:16px">${av(me, 84)}</div><h2>${me.name}</h2><button class="id" data-act="copy-id">${me.id} ${ic('copy', 13)}</button><p class="bio">${esc(me.bio)}</p>
        <div class="st"><div><b>${me.wins}</b><small>Wins</small></div><div><b>${winPct()}%</b><small>Win rate</small></div><div><b>${me.streak}🔥</b><small>Streak</small></div></div>
        <div class="st"><div><b>${me.matches}</b><small>Played</small></div><div><b>${me.daresDone}</b><small>Dares done</small></div><div><b>${me.daresGiven}</b><small>Dares given</small></div></div></div>
      <div><div class="a-tabs" role="tablist">${[['history', 'Match history'], ['stats', 'By game'], ['settings', 'Settings']].map(([k, l]) => `<button class="${t === k ? 'sel' : ''}" role="tab" aria-selected="${t === k}" data-act="tab" data-group="profile" data-tab="${k}">${l}</button>`).join('')}</div>
        ${t === 'history' ? hist : t === 'stats' ? stats : set}</div>
    </div>`;
  }

  const flow = (inner, back) => `${back ? `<button class="a-back" data-go="${back[0]}">${ic('back', 16)} ${back[1]}</button>` : ''}<div class="a-flow">${inner}</div>`;

  A.render = (r, p) => {
    switch (r) {
      case 'home': return shell(home());
      case 'game': return shell(lobby(p || 'rps'));
      case 'queue': return shell(queue(p || 'rps'), true);
      case 'match': return shell(`<div class="a-matchwrap"><div class="a-mtop"><button class="a-leave" data-act="leave-match">${ic('x', 16)} Leave</button><span class="a-mtitle">${esc(gameById(S.game).name.toUpperCase())} · VS ${esc(S.opp.name.toUpperCase())}</span><span class="a-leave" style="visibility:hidden">${ic('x', 16)} Leave</span></div>${matchView()}</div>`, true);
      case 'result': return shell(`<div class="a-confetti"></div>${flow(resultView())}`);
      case 'dare': return shell(flow(dareView(), ['result', 'Result']));
      case 'record': return shell(flow(recordView(), ['dares', 'Dare log']));
      case 'review': return shell(flow(reviewView(), ['dares', 'Dare log']));
      case 'friends': return shell(friends());
      case 'dares': return shell(dares());
      case 'social': return shell(social());
      case 'profile': return shell(profile());
      default: return shell(home());
    }
  };

  A.mount = (root, r, p, isRefresh) => {
    // press-and-hold quick match
    root.querySelectorAll('[data-hold]').forEach((b) => {
      let raf, t0, prog = 0;
      const reset = (early) => { cancelAnimationFrame(raf); if (early && prog > 0 && prog < 1) { b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge'); b.querySelector('span').textContent = 'Keep holding…'; } prog = 0; b.style.setProperty('--h', 0); };
      const step = () => { prog = Math.min(1, (performance.now() - t0) / 700); b.style.setProperty('--h', prog); if (prog >= 1) { cancelAnimationFrame(raf); go('queue', b.dataset.hold); } else raf = requestAnimationFrame(step); };
      b.addEventListener('pointerdown', () => { t0 = performance.now(); raf = requestAnimationFrame(step); });
      b.addEventListener('pointerup', () => reset(true));
      b.addEventListener('pointerleave', () => reset(false));
      b.addEventListener('pointercancel', () => reset(false));
      b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go('queue', b.dataset.hold); } });
    });
    if (r === 'home') { const t = root.querySelector('.a-tile.sel'); if (t) t.scrollIntoView({ block: 'nearest', inline: 'center', behavior: isRefresh ? 'smooth' : 'auto' }); }
    if (r === 'queue' && !isRefresh) {
      qFound = false;
      const t0 = Date.now();
      every(() => { const e = root.querySelector('.a-qt'); if (e) { const s = Math.floor((Date.now() - t0) / 1000); e.textContent = `0:${String(s).padStart(2, '0')}`; } }, 250);
      later(() => { qFound = true; refresh(); later(() => startMatch(p || 'rps', 'quick', RANDOM_PLAYERS[0].name), 1700); }, 3600);
    }
    if (r === 'result' && !isRefresh && S.result && S.result.win) {
      const box = root.querySelector('.a-confetti');
      const cols = ['#FF6B2C', '#2BD67B', '#FFC53D', '#FF4FA3', '#F5F5F6'];
      for (let i = 0; i < 70; i++) { const c = document.createElement('i'); c.style.left = Math.random() * 100 + '%'; c.style.background = pick(cols); c.style.animationDuration = 1.6 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * 0.5 + 's'; box.appendChild(c); }
    }
    if (r === 'friends') {
      const inp = root.querySelector('.js-fsearch');
      inp && inp.addEventListener('input', () => { const q = inp.value.toLowerCase(); root.querySelectorAll('.a-fcard[data-name]').forEach((c) => (c.hidden = !c.dataset.name.includes(q))); });
    }
    if (r === 'social') { const m = root.querySelector('.a-msgs'); if (m) m.scrollTop = m.scrollHeight; if (isRefresh) { const i = root.querySelector('.js-msg'); i && i.focus(); } }
  };

  A.onKey = (e) => {
    if (App.route !== 'home' || $('#overlay').innerHTML || /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { sel = Math.min(sel + 1, DATA.games.length - 1); refresh(); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { sel = Math.max(sel - 1, 0); refresh(); e.preventDefault(); }
    if (e.key === 'Enter' && document.activeElement === document.body) go('game', DATA.games[sel].id);
  };

  A.acts = {
    'a-sel': (el) => { const i = +el.dataset.i; if (i === sel && !DATA.games[i].soon) return go('game', DATA.games[i].id); sel = i; refresh(); },
    'a-friendpick': (el) => {
      const g = gameById(el.dataset.g);
      openSheet(`Challenge · ${g.short}`, `<div class="a-pick">${DATA.friends.map((f) => `<button data-act="start" data-g="${g.id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>${av(f, 52)}${f.name}<small>${f.status === 'online' ? 'online' : f.status === 'match' ? 'in a match' : f.last}</small></button>`).join('')}</div><p class="sheet-foot">Offline friends get the invite when they're back. It expires in 5 minutes.</p>`);
    },
    'a-friend': (el) => {
      const f = friendByName(el.dataset.f);
      const games = DATA.games.filter((g) => !g.soon && g.modes.includes('friend'));
      openSheet(f.name, `<div class="a-fhead">${av(f, 64)}<div><b>${f.name}</b><small>${f.id} · ${statusText(f)}</small></div></div>
        <div class="a-stat3"><div><b>${f.h2h[0]}</b><small>Your wins</small></div><div><b>${f.h2h[1]}</b><small>Their wins</small></div><div><b>${f.fav}</b><small>Favourite</small></div></div>
        <div class="sheet-list">${games.map((g) => `<button class="sheet-item" data-act="start" data-g="${g.id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}><span class="si-emoji">${g.emoji}</span><span class="si-txt"><b>Challenge to ${esc(g.name)}</b><small>${esc(g.meta.slice(0, 2).join(' · '))}</small></span><span class="si-go">→</span></button>`).join('')}</div>
        <div class="r-actions"><button class="r-btn" data-act="a-msg" data-f="${f.name}">${ic('chat', 18)} Message</button><button class="r-btn" data-act="block" data-f="${f.name}">Block</button></div>`);
    },
    'a-msg': (el) => { S.tabs.chat = el.dataset.f; go('social'); },
    'a-chat': (el) => { S.tabs.chat = el.dataset.f; refresh(); },
    'a-chatback': () => { S.tabs.chat = null; refresh(); },
    'a-set': (el) => { const v = el.dataset.v; S.tabs[el.dataset.k] = isNaN(+v) ? v : +v; refresh(); },
  };

  CONCEPTS.a = A;
})();
</script>

  function home() {

      <div class="b-post"><div class="b-ph">${av(friendByName('Kavin'), 40)}<div><b>Kavin posted a dare</b><small>Dance · for Rahul · 5h ago</small></div></div><button class="b-vid" style="--c:#14C49A" data-act="story" data-i="1">💃<span class="play">▶ 0:10</span><span class="cap">"Rahul made me do this. Never again."</span></button><div class="b-acts"><button class="b-react" data-act="react">🔥 <span>41</span></button><button class="b-react" data-act="react" data-e="😂">😂 <span>12</span></button><button class="b-react" data-act="react" data-e="👏">👏 <span>8</span></button></div></div>
      <div class="b-post lilac"><div class="b-ph">${av(friendByName('Priya'), 40)}<div><b>Priya did your Mimicry dare</b><small>Submitted 20 min ago · watch once</small></div></div><div class="b-acts"><button class="b-btn" data-go="review">${ic('play', 14)} Watch once</button></div></div>
      <div class="b-post"><div class="b-ph"><b>Rock Paper Scissors</b><span class="t">3h ago</span></div><div class="b-score">${av(friendByName('Priya'), 38)} 5 <span style="color:var(--mu)">–</span> 3 ${av(friendByName('Vikram'), 38)}</div><p style="margin-top:10px">Priya beat Vikram and picked <b>🎤 Singing</b>. He has 21 hours.</p><div class="b-acts"><button class="b-react" data-act="react">🔥 <span>12</span></button><button class="b-react" data-act="react" data-e="😬">😬 <span>5</span></button></div></div>
      <div class="b-post mint"><div class="b-ph">${avd(friendByName('Rahul'), 40)}<div><b>Rahul is online</b><small>You're 9–2 against him in Hand Cricket</small></div></div><div class="b-acts"><button class="b-btn" data-act="challenge" data-f="Rahul">${ic('swords', 16)} Challenge</button><button class="b-btn light" data-act="b-msg" data-f="Rahul">Message</button></div></div>`;
    const rail = `<div class="b-rail">
      <div class="b-card b-streak"><div class="n">${DATA.me.streak}🔥</div><b>win streak</b><p style="font-size:13px;color:#6b4e00">One more and you hit 5.</p></div>
      <div class="b-card"><h3>Online now <button data-go="friends">See all</button></h3><div class="b-online">${online.map((f) => `<div class="b-orow">${avd(f, 38)}<div><b>${f.name}</b><small>${statusText(f)}</small></div><button class="b-btn light" data-act="challenge" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>Play</button></div>`).join('')}</div></div>
      ${DATA.requests.length ? `<div class="b-card"><h3>Requests</h3>${DATA.requests.map((r) => `<div class="b-orow" style="margin-bottom:8px">${av(r, 38)}<div><b>${r.name}</b><small>${r.mutual} mutual</small></div><button class="b-btn" data-act="accept" data-f="${r.name}">Accept</button></div>`).join('')}</div>` : ''}

      <div class="b-card b-compose"><div class="top">${av(DATA.me, 40)} What are we playing tonight?</div><div class="b-chips">${DATA.games.map((g) => `<button class="b-chip ${g.soon ? 'soon' : ''}" ${g.soon ? 'data-act="notify"' : `data-go="game" data-param="${g.id}"`}>${g.emoji} ${g.short}${g.isNew ? ' · new' : ''}${g.soon ? ' · soon' : ''}</button>`).join('')}</div><button class="b-btn acc" style="align-self:flex-start" data-go="queue" data-param="rps">${ic('bolt', 16)} Quick RPS match</button></div>

  function lobby(id) {

    const hc = { rps: '#FF5A3C', chess: '#14C49A', cricket: '#F5A400', mystery: '#8C7BFF' }[id];

      <button class="b-back" data-go="home">${ic('back', 16)} Home</button>

        <div class="b-acts" style="margin-top:16px">${g.soon ? '<button class="b-btn white" data-act="notify">🔔 Notify me</button>' : `${g.modes.includes('quick') ? `<button class="b-btn white" data-go="queue" data-param="${id}">${ic('bolt', 16)} Quick match</button>` : ''}${g.modes.includes('solo') ? `<button class="b-btn white" data-act="start" data-g="${id}" data-mode="solo">${ic('bot', 16)} Solo vs EVO Bot</button>` : ''}`}</div></div>
      ${g.soon ? '' : `<div class="b-card" style="margin-top:16px"><h3>Pick who to play</h3><div class="b-who hide-sb">${DATA.friends.map((f) => `<button data-act="start" data-g="${id}" data-mode="friend" data-f="${f.name}" ${f.status === 'match' ? 'disabled' : ''}>${avd(f, 58)}${f.name}</button>`).join('')}</div><p style="font-size:13px;color:var(--mu)">They get an invite. It expires in 5 minutes. The winner picks the loser's dare.</p></div>`}
      ${id === 'chess' ? `<div class="b-card" style="margin-top:16px"><h3>Clock</h3><div class="b-seg">${DATA.chessTimes.map((t, i) => `<button class="${tc === i ? 'sel' : ''}" data-act="b-set" data-k="chessTime" data-v="${i}">${t[0]} ${t[1]}</button>`).join('')}</div><h3 style="margin-top:14px">Play as</h3><div class="b-seg">${['Random', 'White', 'Black'].map((c) => `<button class="${col === c ? 'sel' : ''}" data-act="b-set" data-k="chessCol" data-v="${c}">${c}</button>`).join('')}</div></div>` : ''}

      <label class="b-search">${ic('search', 18)}<input class="js-bsearch" placeholder="Search by name or EVO-ID" aria-label="Search friends"></label>
      ${DATA.requests.length ? `<div class="b-card" style="margin-bottom:16px"><h3>Wants to be friends</h3>${DATA.requests.map((r) => `<div class="b-frow">${av(r, 46)}<div><b>${r.name}</b><small>${r.mutual} mutual friends</small></div><div class="r"><button class="b-btn acc" data-act="accept" data-f="${r.name}">Accept</button><button class="b-btn light" data-act="decline" data-f="${r.name}">Not now</button></div></div>`).join('')}</div>` : ''}
      <div class="b-card"><h3>Your friends</h3><div class="b-list">${DATA.friends.map(row).join('')}</div></div>
      <h3 style="font:600 18px Fredoka;margin:20px 0 10px">People you may know</h3><div class="b-sugg hide-sb">${DATA.suggestions.map((s) => `<div>${av(s, 58)}<b>${s.name}</b><small>${s.mutual} mutual</small><button class="b-btn" data-act="add" data-f="${s.name}">${ic('plus', 14)} Add</button></div>`).join('')}</div>
    </div><div class="b-rail"><div class="b-card b-invite"><h3>Invite a friend</h3><p style="color:#fff;opacity:.9;font-size:14px">Anyone who opens your link can add you in one tap.</p><code>evoaiqu.app/invite/monesh-7K2Q9</code><div class="b-acts"><button class="b-btn white" data-act="copy">${ic('copy', 16)} Copy</button><button class="b-btn" style="background:#25D366" data-act="share-wa">WhatsApp</button></div></div>
      <div class="b-card"><h3>Your EVO-ID</h3><button class="b-btn light" data-act="copy-id" style="font-family:'JetBrains Mono'">${DATA.me.id} ${ic('copy', 14)}</button></div></div></div>`;
  }

  function dares() {
    const t = S.tabs.bdares || 'needs';
    const list = t === 'needs' ? DATA.dares.filter((d) => d.kind !== 'waiting') : t === 'sent' ? DATA.dares.filter((d) => d.kind === 'waiting') : [];
    const card = (d) => `<div class="b-post ${d.kind === 'owe' ? 'hot' : d.kind === 'review' ? 'lilac' : ''}"><div class="b-ph">${av(friendByName(d.who), 40)}<div><b>${d.kind === 'owe' ? `${d.who} dared you` : d.kind === 'review' ? `${d.who} did your dare` : `You dared ${d.who}`}</b><small>${esc(d.game)} match</small></div><span class="t">${d.hours ? d.hours + 'h left' : 'ready'}</span></div><p class="big">${d.emoji} ${esc(d.cat)}: ${esc(d.text)}</p><div class="b-acts">${d.kind === 'owe' ? `<button class="b-btn white" data-go="record">${ic('video', 16)} Record</button>` : d.kind === 'review' ? `<button class="b-btn" data-go="review">${ic('play', 14)} Watch once</button>` : `<button class="b-btn light" data-act="nudge" data-f="${d.who}">👋 Nudge</button>`}</div></div>`;
    return `<div class="b-cols one"><div><h1 class="b-h1">Dares</h1><p class="b-sub">Everything you owe, everything owed to you.</p>
      <div class="b-tabs" role="tablist">${[['needs', `Needs you · ${dareNeedsYou()}`], ['sent', 'Sent'], ['done', 'Done']].map(([k, l]) => `<button class="${t === k ? 'sel' : ''}" role="tab" aria-selected="${t === k}" data-act="tab" data-group="bdares" data-tab="${k}">${l}</button>`).join('')}</div>
      <div class="b-feed" style="margin-top:0">${list.map(card).join('') || `<div class="b-post"><p class="big">🎉 2 dares completed this week</p><p>You sang for Vikram. Priya's mimicry for you was approved.</p></div>`}</div></div></div>`;
